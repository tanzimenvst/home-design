<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home Design · 3D Architectural Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111714;
      color: #edf1e9;
      overflow: hidden;
    }

    #view {
      position: fixed;
      inset: 0;
    }

    #map {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #3388dd 0%, #c0ddf9 45%, #d5e9fa 70%, #e8f3fc 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Bottom Left Control Bar / Vertical Sidebar */
    .control-bar,
    .sidebar-v {
      position: fixed;
      bottom: 14px;
      left: 14px;
      width: 148px;
      background: rgba(16, 22, 19, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 5px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 100;
      user-select: none;
      box-sizing: border-box;
    }

    .sidebar-v-row {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    .sidebar-btn,
    .ctrl-btn {
      height: 26px;
      padding: 0 4px;
      background: rgba(26, 34, 29, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 5px;
      color: #e2ebe5;
      font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
      transition: all 0.15s ease;
      box-sizing: border-box;
      width: 100%;
      flex: 1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .sidebar-btn:hover:not(:disabled):not(.disabled),
    .ctrl-btn:hover:not(:disabled):not(.disabled) {
      background: #274534;
      border-color: #4ade80;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.45), 0 2px 6px rgba(0, 0, 0, 0.35);
      transform: translateY(-1px);
    }

    .sidebar-btn.active,
    .ctrl-btn.active {
      background: #25663e;
      border-color: #4ade80;
      color: #ffffff;
      box-shadow: 0 1px 8px rgba(37, 102, 62, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .sidebar-btn.active:hover:not(:disabled):not(.disabled),
    .ctrl-btn.active:hover:not(:disabled):not(.disabled) {
      background: #2d774a;
      border-color: #6ee7b7;
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
      transform: translateY(-1px);
    }

    .sidebar-btn:disabled,
    .sidebar-btn.disabled,
    .ctrl-btn:disabled,
    .ctrl-btn.disabled {
      opacity: 0.32;
      cursor: not-allowed;
      pointer-events: none;
      background: rgba(20, 26, 23, 0.45);
      border-color: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.35);
      box-shadow: none;
      transform: none;
    }

    @media (max-width: 600px) {

      .control-bar,
      .sidebar-v {
        bottom: 8px;
        left: 8px;
        width: 132px;
        gap: 3px;
        padding: 4px;
      }

      .sidebar-v-row {
        gap: 3px;
      }

      .sidebar-btn,
      .ctrl-btn {
        height: 23px;
        font-size: 9.5px;
        padding: 0 2px;
      }
    }
  </style>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  </script>
</head>

<body>
  <div id="view"></div>
  <div id="map" style="display: none;"></div>
  <nav class="sidebar-v" id="control-bar">
    <!-- Row 1: Interior Layout -->
    <div class="sidebar-v-row">
      <button id="btn-env-studio" class="ctrl-btn active" title="Interior Layout (2nd Floor Plan &amp; Interior)">Interior
        Layout</button>
    </div>

    <!-- Row 2: 2D Plan | Furniture -->
    <div class="sidebar-v-row">
      <button id="btn-layer-2d" class="ctrl-btn" title="Toggle 2D floor plan underlay">2D
        Plan</button>
      <button id="btn-layer-furniture" class="ctrl-btn"
        title="Toggle interior furniture on/off">Furniture</button>
    </div>

    <hr style="width: 100%; border-color: #474747;">

    <!-- Row 3: Landscape -->
    <div class="sidebar-v-row" id="basemap-section">
      <button id="btn-basemap-grass" class="ctrl-btn"
        title="Outdoor landscape environment with grass &amp; sky">Landscape</button>
    </div>

    <!-- Row 4: Roadmap | Satellite -->
    <div class="sidebar-v-row">
      <button id="btn-basemap-default" class="ctrl-btn" title="Google Maps standard roadmap basemap">Roadmap</button>
      <button id="btn-basemap-satellite" class="ctrl-btn"
        title="Google Maps satellite imagery basemap">Satellite</button>
    </div>

    <!-- 3D Buildings Toggle -->
    <div class="sidebar-v-row" id="row-3d-buildings">
      <button id="btn-toggle-3d" class="ctrl-btn disabled" disabled
        title="Toggle 3D surrounding buildings (Roadmap &amp; Satellite only)">3D Buildings</button>
    </div>

    <!-- Row 5: Current | Complete -->
    <div class="sidebar-v-row" id="building-view-section">
      <button id="btn-view-current" class="ctrl-btn disabled" disabled
        title="Current view (Outdoor only)">Current</button>
      <button id="btn-view-complete" class="ctrl-btn disabled" disabled
        title="Complete view (Outdoor only)">Complete</button>
    </div>

    <hr style="width: 100%; border-color: #474747;">

    <!-- Row 6: Top View | Reset View -->
    <div class="sidebar-v-row">
      <button id="btn-cam-top" class="ctrl-btn" title="Top-down camera view">Top View</button>
      <button id="btn-cam-reset" class="ctrl-btn" title="Reset perspective camera angle">Reset View</button>
    </div>
  </nav>

    // Build 3D walls directly from the 58 GeoJSON polygons and elevation layers with clean integer fills
    function buildWallsFromLayout() {
      const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      // 1. Establish master base wall footprint (10 ft top cap footprint)
      ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffffff';
      for (const feat of LAYOUT_FEATURES) {
        if (feat.type === 'glass_partition') continue;
        const pts = feat.pts;
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.closePath();
        ctx.fill();
      }
      const baseData = ctx.getImageData(0, 0, W, H).data;
      const base = new Uint8Array(W * H);
      for (let i = 0, p = 0; i < baseData.length; i += 4, p++) if (baseData[i] > 100) base[p] = 1;

      // 2. Elevation layers representing all transition levels
      const layers = [
        [0.0, 1.0],
        [1.0, 2.0],
        [2.0, 2.5],
        [2.5, 3.5],
        [3.5, 5.0],
        [5.0, 6.0],
        [6.0, 7.0],
        [7.0, 7.5],
        [7.5, 8.0],
        [8.0, 9.5],
        [9.5, wallHeight]
      ];

      const unit = 1 / SCALE;
      function addQuad(buf, p1, p2, p3, p4) { buf.push(...p1, ...p2, ...p3, ...p1, ...p3, ...p4); }
      function makeSurface(buffers, material) {
        if (!buffers.length) return;
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(buffers, 3));
        g.computeVertexNormals();
        const m = new THREE.Mesh(g, material);
        m.receiveShadow = false; m.castShadow = false;
        walls.add(m);
      }

      for (const [y0, y1] of layers) {
        ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffffff';

        for (const feat of LAYOUT_FEATURES) {
          if (feat.type === 'glass_partition') continue;
          let isSolid;
          if (feat.solidIntervals) {
            isSolid = feat.solidIntervals.some(([sy0, sy1]) => y0 >= sy0 - 1e-4 && y1 <= sy1 + 1e-4);
          } else {
            isSolid = (feat.type === '' || feat.h >= 10.0) ||
              (y1 <= feat.lw + 1e-4) ||
              (y0 >= feat.lw + feat.h - 1e-4);
          }
          if (isSolid) {
            const pts = feat.pts;
            ctx.beginPath();
            ctx.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
            ctx.closePath();
            ctx.fill();
          }
        }

        const layerData = ctx.getImageData(0, 0, W, H).data;
        const solid = new Uint8Array(W * H);
        for (let i = 0, p = 0; i < layerData.length; i += 4, p++) {
          if (layerData[i] > 100 && base[p]) solid[p] = 1;
        }

        const faces = [[], [], [], []], wy0 = y0, wy1 = y1;
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
          const i = y * W + x; if (!solid[i]) continue;
          const x0 = (x - ox) * unit, x1 = x0 + unit, z0 = (y - oy) * unit, z1 = z0 + unit;
          if (x === 0 || !solid[i - 1]) addQuad(faces[0], [x0, wy0, z0], [x0, wy0, z1], [x0, wy1, z1], [x0, wy1, z0]);
          if (x === W - 1 || !solid[i + 1]) addQuad(faces[1], [x1, wy0, z0], [x1, wy1, z0], [x1, wy1, z1], [x1, wy0, z1]);
          if (y === 0 || !solid[i - W]) addQuad(faces[2], [x0, wy0, z0], [x0, wy1, z0], [x1, wy1, z0], [x1, wy0, z0]);
          if (y === H - 1 || !solid[i + W]) addQuad(faces[3], [x0, wy0, z1], [x1, wy0, z1], [x1, wy1, z1], [x0, wy1, z1]);

    function buildStylishDesignerPartition() {
      const partitionGroup = new THREE.Group();

      const panelLen = totalLen / numPanels;

      for (let p = 0; p < numPanels; p++) {

    // Helper: Rounded rectangle 2D shape (centered at origin (0,0))
    function createRoundedRectShape(w, h, r) {
      const shape = new THREE.Shape();
      const x0 = -w / 2, x1 = w / 2;
      const y0 = -h / 2, y1 = h / 2;
      shape.moveTo(x0 + r, y0);
      shape.lineTo(x1 - r, y0);
      shape.absarc(x1 - r, y0 + r, r, -Math.PI / 2, 0, false);
      shape.lineTo(x1, y1 - r);
      shape.absarc(x1 - r, y1 - r, r, 0, Math.PI / 2, false);
      shape.lineTo(x0 + r, y1);
      shape.absarc(x0 + r, y1 - r, r, Math.PI / 2, Math.PI, false);
      shape.lineTo(x0, y0 + r);

    // Helper: Procedural high-resolution shaded marble texture
    function createMarbleTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#f7f6f2';
      ctx.fillRect(0, 0, 512, 512);

      const imgData = ctx.getImageData(0, 0, 512, 512);
      const data = imgData.data;
      for (let y = 0; y < 512; y++) {
        for (let x = 0; x < 512; x++) {
          const idx = (y * 512 + x) * 4;
          const nx = x / 55, ny = y / 55;
          const v1 = Math.sin(nx + Math.sin(ny * 2.2) * 1.6 + Math.cos(nx * 0.9 + ny * 1.1) * 2.1);
          const v2 = Math.sin(nx * 1.7 - ny * 1.4 + Math.sin(nx * 2.8) * 0.7);
          const vein = Math.exp(-Math.pow(v1 * 2.6, 2)) * 0.42 + Math.exp(-Math.pow(v2 * 3.4, 2)) * 0.22;
          const tone = Math.sin((x + y) * 0.02) * 5;

          // Creamy marble with soft grey-taupe-gold veins
          data[idx] = Math.min(255, Math.max(0, 247 - vein * 115 + tone));
          data[idx + 1] = Math.min(255, Math.max(0, 244 - vein * 110 + tone));
          data[idx + 2] = Math.min(255, Math.max(0, 239 - vein * 105 + tone));
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // Geometric Helper: Create Extruded Prism Mesh with Outward Normals and Solid Enclosure
    function createPrismMesh(pts, y0, y1, material) {
      const n = pts.length;
      if (n < 3) return new THREE.Group();

      // Determine polygon winding in (X, Z) plane:
      // In Three.js screen projection (+X East, +Z South):
      // sum > 0 means clockwise (interior to right, exterior to left)
      let signedArea = 0;
      for (let i = 0; i < n; i++) {
        const p1 = pts[i], p2 = pts[(i + 1) % n];
        signedArea += (p1[0] * p2[1] - p2[0] * p1[1]);
      }
      const isCW = signedArea >= 0;

      const positions = [];
      for (let i = 0; i < n; i++) {
        const p1 = pts[i];
        const p2 = pts[(i + 1) % n];
        if (isCW) {
          // CW polygon: normal (dz, 0, -dx) points OUTWARD
          positions.push(
            p1[0], y0, p1[1], p2[0], y1, p2[1], p2[0], y0, p2[1],
            p1[0], y0, p1[1], p1[0], y1, p1[1], p2[0], y1, p2[1]
          );
        } else {
          // CCW polygon: normal (-dz, 0, dx) points OUTWARD
          positions.push(
            p1[0], y0, p1[1], p2[0], y0, p2[1], p2[0], y1, p2[1],
            p1[0], y0, p1[1], p2[0], y1, p2[1], p1[0], y1, p1[1]
          );
        }
      }

      // Top and bottom cap triangulation
      try {
        const shapePts = pts.map(p => new THREE.Vector2(p[0], p[1]));
        const tris = THREE.ShapeUtils.triangulateShape(shapePts, []);
        for (const [i0, i1, i2] of tris) {
          if (isCW) {
            // Top (+Y normal pointing UP)
            positions.push(
              pts[i0][0], y1, pts[i0][1],
              pts[i2][0], y1, pts[i2][1],
              pts[i1][0], y1, pts[i1][1]
            );
            // Bottom (-Y normal pointing DOWN)
            positions.push(
              pts[i0][0], y0, pts[i0][1],
              pts[i1][0], y0, pts[i1][1],
              pts[i2][0], y0, pts[i2][1]
            );
          } else {
            // CCW: Top (+Y normal pointing UP)
            positions.push(
              pts[i0][0], y1, pts[i0][1],
              pts[i1][0], y1, pts[i1][1],
              pts[i2][0], y1, pts[i2][1]
            );
            // Bottom (-Y normal pointing DOWN)
            positions.push(
              pts[i0][0], y0, pts[i0][1],
              pts[i2][0], y0, pts[i2][1],
              pts[i1][0], y0, pts[i1][1]
            );
          }
        }
      } catch (e) { }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.computeVertexNormals();
      return new THREE.Mesh(geom, material);
    }

    // Window Builder: Identical in frame, dimensions, and styling to 2nd floor windows,
    // with non-transparent glass and privacy backing so interior cannot be seen.
    function createOpaqueWindow(pts, y0, y1) {
      const xs = pts.map(p => p[0]), zs = pts.map(p => p[1]);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minZ = Math.min(...zs), maxZ = Math.max(...zs);
      const dx = maxX - minX, dz = maxZ - minZ;
      const height = y1 - y0;

      let a, b;
      if (dx >= dz) {
        a = [minX, (minZ + maxZ) / 2];
        b = [maxX, (minZ + maxZ) / 2];
      } else {
        a = [(minX + maxX) / 2, minZ];
        b = [(minX + maxX) / 2, maxZ];
      }

      const [x1, z1] = a, [x2, z2] = b;
      const wdx = x2 - x1, wdz = z2 - z1;
      const len = Math.hypot(wdx, wdz);
      const angle = -Math.atan2(wdz, wdx);

      const midX = (x1 + x2) / 2, midZ = (z1 + z2) / 2;
      const inwardX = 28.35 - midX, inwardZ = 19.8 - midZ;
      const inSign = (Math.sin(angle) * inwardX + Math.cos(angle) * inwardZ) >= 0 ? 1 : -1;

      const frame = new THREE.Group();
      frame.position.set(midX, 0, midZ);
      frame.rotation.y = angle;

      // 1. Opaque Glass Pane (Exact same color '#b9d7df', roughness .16, metalness .08 as 2nd floor, but non-transparent)
      const pane = new THREE.Mesh(
        new THREE.BoxGeometry(Math.max(0.2, len - 0.12), height - 0.10, 0.07),
        opaqueExteriorGlassMat
      );
      pane.position.y = y0 + height / 2;
      frame.add(pane);

      // 2. Interior Privacy Backing Plate (placed strictly on interior side so exterior shows blue glass)
      const backing = new THREE.Mesh(
        new THREE.BoxGeometry(Math.max(0.2, len - 0.12), height - 0.10, 0.02),
        windowBackingMat
      );
      backing.position.set(0, y0 + height / 2, inSign * 0.045);
      frame.add(backing);

      // 3. Top and Bottom Rails (Exact same as 2nd floor in windowFrameMat '#faf8f0')
      const frameDepth = 0.14;
      for (const y of [y0 + 0.04, y0 + height - 0.04]) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.08, frameDepth), windowFrameMat);
        rail.position.y = y;
        frame.add(rail);
      }

      // 4. Left and Right Stiles (Exact same as 2nd floor in windowFrameMat '#faf8f0')
      for (const side of [-1, 1]) {
        const stile = new THREE.Mesh(new THREE.BoxGeometry(0.07, height, frameDepth), windowFrameMat);
        stile.position.set(side * (len / 2 - 0.035), y0 + height / 2, 0);
        frame.add(stile);
      }

      // 5. Center Vertical Mullion (Exact same as 2nd floor in windowFrameMat '#faf8f0')
      if (len > 3.4) {
        const mullion = new THREE.Mesh(new THREE.BoxGeometry(0.07, height, frameDepth), windowFrameMat);
        mullion.position.set(0, y0 + height / 2, 0);
        frame.add(mullion);
      }

      return frame;
    }

    // Straight Grill Segment: Crisp white metal rails & vertical posts matching 2nd floor, concrete sill & soffit, completely open look-through
    function createStraightGrill(minX, maxX, minZ, maxZ, y0, y1) {
      const group = new THREE.Group();
      const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2, cy = (y0 + y1) / 2;
      const dx = maxX - minX, dz = maxZ - minZ;
      const h = y1 - y0;

      if (dx >= dz) {
        // Front / horizontal grill running along X
        // 1. Concrete sill cap at bottom (y0)
        const sill = new THREE.Mesh(new THREE.BoxGeometry(dx + 0.04, 0.035, dz + 0.04), exteriorSillCapMat);
        sill.position.set(cx, y0 + 0.0175, cz);
        // 2. Concrete lintel soffit trim at top (y1)
        const soffit = new THREE.Mesh(new THREE.BoxGeometry(dx + 0.04, 0.035, dz + 0.04), exteriorSillCapMat);
        soffit.position.set(cx, y1 - 0.0175, cz);
        group.add(sill, soffit);

        // 3. Crisp white bottom and top rails
        const botRail = new THREE.Mesh(new THREE.BoxGeometry(dx, 0.08, 0.08), exteriorGrillMat);
        botRail.position.set(cx, y0 + 0.05, cz);
        const topRail = new THREE.Mesh(new THREE.BoxGeometry(dx, 0.08, 0.08), exteriorGrillMat);
        topRail.position.set(cx, y1 - 0.05, cz);
        group.add(botRail, topRail);

        // 4. Vertical posts (ends + intermediate ~every 3.2 ft)
        const numPosts = Math.max(1, Math.round(dx / 3.2));
        for (let i = 0; i <= numPosts; i++) {
          const px = minX + 0.04 + (i / numPosts) * (dx - 0.08);
          const post = new THREE.Mesh(new THREE.BoxGeometry(0.075, h - 0.08, 0.075), exteriorGrillMat);
          post.position.set(px, cy, cz);
          group.add(post);
        }

        // 5. Horizontal bars (11-13 bars across height, with thicker mid-handrail)
        const numBars = Math.max(6, Math.round((h - 0.16) / 0.45));
        const barStep = (h - 0.16) / (numBars + 1);
        const midIdx = Math.round(numBars * 0.38);
        for (let k = 1; k <= numBars; k++) {
          const yBar = y0 + 0.08 + k * barStep;
          const isMidHandrail = (k === midIdx);
          const barGeom = new THREE.BoxGeometry(
            dx,
            isMidHandrail ? 0.06 : 0.045,
            isMidHandrail ? 0.07 : 0.045
          );
          const bar = new THREE.Mesh(barGeom, exteriorGrillMat);
          bar.position.set(cx, yBar, cz);
          group.add(bar);
        }
      } else {
        // Side grill running along Z
        // 1. Concrete sill cap at bottom (y0)
        const sill = new THREE.Mesh(new THREE.BoxGeometry(dx + 0.04, 0.035, dz + 0.04), exteriorSillCapMat);
        sill.position.set(cx, y0 + 0.0175, cz);
        // 2. Concrete lintel soffit trim at top (y1)
        const soffit = new THREE.Mesh(new THREE.BoxGeometry(dx + 0.04, 0.035, dz + 0.04), exteriorSillCapMat);
        soffit.position.set(cx, y1 - 0.0175, cz);
        group.add(sill, soffit);

        // 3. Crisp white bottom and top rails
        const botRail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, dz), exteriorGrillMat);
        botRail.position.set(cx, y0 + 0.05, cz);
        const topRail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, dz), exteriorGrillMat);
        topRail.position.set(cx, y1 - 0.05, cz);
        group.add(botRail, topRail);

        // 4. Vertical posts (ends + intermediate ~every 3.2 ft)
        const numPosts = Math.max(1, Math.round(dz / 3.2));
        for (let i = 0; i <= numPosts; i++) {
          const pz = minZ + 0.04 + (i / numPosts) * (dz - 0.08);
          const post = new THREE.Mesh(new THREE.BoxGeometry(0.075, h - 0.08, 0.075), exteriorGrillMat);
          post.position.set(cx, cy, pz);
          group.add(post);
        }

        // 5. Horizontal bars
        const numBars = Math.max(6, Math.round((h - 0.16) / 0.45));
        const barStep = (h - 0.16) / (numBars + 1);
        const midIdx = Math.round(numBars * 0.38);
        for (let k = 1; k <= numBars; k++) {
          const yBar = y0 + 0.08 + k * barStep;
          const isMidHandrail = (k === midIdx);
          const barGeom = new THREE.BoxGeometry(
            isMidHandrail ? 0.07 : 0.045,
            isMidHandrail ? 0.06 : 0.045,
            dz
          );
          const bar = new THREE.Mesh(barGeom, exteriorGrillMat);
          bar.position.set(cx, yBar, cz);
          group.add(bar);
        }
      }
      return group;
    }

    // Balcony Grill Builder: Crisp white rails & posts matching 2nd floor, look-through with NO backing
    function createGrillMesh(pts, y0, y1) {
      const group = new THREE.Group();
      const xs = pts.map(p => p[0]), zs = pts.map(p => p[1]);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minZ = Math.min(...zs), maxZ = Math.max(...zs);
      const dx = maxX - minX, dz = maxZ - minZ;

      if (dx > 1.5 && dz > 1.5) {
        // L-shaped corner balcony grill (e.g. South-West or South-East balcony)
        if (minX < 20) {
          // South-West corner (ID 18)
          group.add(createStraightGrill(minX, minX + 0.51, minZ, maxZ, y0, y1)); // West side segment
          group.add(createStraightGrill(minX, maxX, maxZ - 0.51, maxZ, y0, y1)); // South front segment
        } else {
          // South-East corner (ID 19)
          group.add(createStraightGrill(maxX - 0.51, maxX, minZ, maxZ, y0, y1)); // East side segment
          group.add(createStraightGrill(minX, maxX, maxZ - 0.51, maxZ, y0, y1)); // South front segment
        }
      } else {
        // Straight grill segment
        group.add(createStraightGrill(minX, maxX, minZ, maxZ, y0, y1));
      }
      return group;
    }

    // Closed Door Builder: Elegantly modeled closed residential door with frame, leaf, raised panels, and brass hardware
    // options: { flipLock?: boolean, solidColor?: boolean }
    function createClosedDoor(pts, y0, y1, options = {}) {
      const flipLock = !!options.flipLock;
      const solidColor = !!options.solidColor;
      const group = new THREE.Group();
      const xs = pts.map(p => p[0]), zs = pts.map(p => p[1]);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minZ = Math.min(...zs), maxZ = Math.max(...zs);
      const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
      const dx = maxX - minX, dz = maxZ - minZ;
      const h = y1 - y0;

      const frameMat = solidColor ? solidDoorFrameMat : closedDoorFrameMat;
      const leafMat = solidColor ? solidDoorMat : closedDoorWoodMat;
      const panelMat = solidColor ? solidDoorMat : closedDoorPanelMat;
      const lockDir = flipLock ? -1 : 1;

      if (dx >= dz) {
        // Door running along X axis (North/South wall)
        const len = dx;
        const frameDepth = Math.max(0.40, dz);
        const doorW = Math.max(0.6, len - 0.20);
        const doorH = h - 0.08;

        // 1. Frame Jambs
        for (const side of [-1, 1]) {
          const jamb = new THREE.Mesh(new THREE.BoxGeometry(0.10, h, frameDepth), frameMat);
          jamb.position.set(cx + side * (len / 2 - 0.05), y0 + h / 2, cz);
          group.add(jamb);
        }
        // 2. Header and Sill
        const head = new THREE.Mesh(new THREE.BoxGeometry(len, 0.08, frameDepth), frameMat);
        head.position.set(cx, y1 - 0.04, cz);
        const sill = new THREE.Mesh(new THREE.BoxGeometry(len, 0.05, frameDepth), frameMat);
        sill.position.set(cx, y0 + 0.025, cz);
        group.add(head, sill);

        // 3. Closed Door Leaf
        const leaf = new THREE.Mesh(new THREE.BoxGeometry(doorW, doorH, 0.13), leafMat);
        leaf.position.set(cx, y0 + 0.05 + doorH / 2, cz);
        group.add(leaf);

        // 4. Raised Decorative Panels on both outer and inner faces
        for (const s of [-0.078, 0.078]) {
          const p1 = new THREE.Mesh(new THREE.BoxGeometry(doorW * 0.68, doorH * 0.32, 0.028), panelMat);
          p1.position.set(cx, y0 + 0.05 + doorH * 0.24, cz + s);
          const p2 = new THREE.Mesh(new THREE.BoxGeometry(doorW * 0.68, doorH * 0.44, 0.028), panelMat);
          p2.position.set(cx, y0 + 0.05 + doorH * 0.72, cz + s);
          group.add(p1, p2);

          // Brass Door Handle & Plate
          const handlePlate = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.32, 0.015), closedDoorHardwareMat);
          handlePlate.position.set(cx + lockDir * doorW * 0.38, y0 + 3.0, cz + s);
          const handleLever = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.04, 0.04), closedDoorHardwareMat);
          handleLever.position.set(cx + lockDir * doorW * 0.32, y0 + 3.0, cz + (s > 0 ? s + 0.04 : s - 0.04));
          group.add(handlePlate, handleLever);
        }
      } else {
        // Door running along Z axis (East/West wall)
        const len = dz;
        const frameDepth = Math.max(0.40, dx);
        const doorW = Math.max(0.6, len - 0.20);
        const doorH = h - 0.08;

        // 1. Frame Jambs
        for (const side of [-1, 1]) {
          const jamb = new THREE.Mesh(new THREE.BoxGeometry(frameDepth, h, 0.10), frameMat);
          jamb.position.set(cx, y0 + h / 2, cz + side * (len / 2 - 0.05));
          group.add(jamb);
        }
        // 2. Header and Sill
        const head = new THREE.Mesh(new THREE.BoxGeometry(frameDepth, 0.08, len), frameMat);
        head.position.set(cx, y1 - 0.04, cz);
        const sill = new THREE.Mesh(new THREE.BoxGeometry(frameDepth, 0.05, len), frameMat);
        sill.position.set(cx, y0 + 0.025, cz);
        group.add(head, sill);

        // 3. Closed Door Leaf
        const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.13, doorH, doorW), leafMat);
        leaf.position.set(cx, y0 + 0.05 + doorH / 2, cz);
        group.add(leaf);

        // 4. Raised Decorative Panels on both outer and inner faces
        for (const s of [-0.078, 0.078]) {
          const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.028, doorH * 0.32, doorW * 0.68), panelMat);
          p1.position.set(cx + s, y0 + 0.05 + doorH * 0.24, cz);
          const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.028, doorH * 0.44, doorW * 0.68), panelMat);
          p2.position.set(cx + s, y0 + 0.05 + doorH * 0.72, cz);
          group.add(p1, p2);

          // Brass Door Handle & Plate
          const handlePlate = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.32, 0.08), closedDoorHardwareMat);
          handlePlate.position.set(cx + s, y0 + 3.0, cz + lockDir * doorW * 0.38);
          const handleLever = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.22), closedDoorHardwareMat);
          handleLever.position.set(cx + (s > 0 ? s + 0.04 : s - 0.04), y0 + 3.0, cz + lockDir * doorW * 0.32);
          group.add(handlePlate, handleLever);
        }
      }
      return group;
    }    // Staircase Flight Builder: Concrete waist slab, individual open treads & risers (NOT filled to ground), and baluster handrail
    function createStairMesh(pts, y0, y1) {
      const group = new THREE.Group();
      const xs = pts.map(p => p[0]), zs = pts.map(p => p[1]);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minZ = Math.min(...zs), maxZ = Math.max(...zs);
      const w = maxX - minX, depth = maxZ - minZ, h = y1 - y0;
      const numSteps = Math.max(2, Math.round(h / 0.588));
      const stepH = h / numSteps;
      const stepD = depth / numSteps;

      // Flight direction:
      // Flight #51 (ah: 3.0, h: 10.0): ascends towards South (+Z)
      // Flight #49 (ah: 2.0, h: 1.0): ascends towards North (-Z)
      const ascendSouth = (y0 >= 2.5 && y0 < 8.0);

      const stairWaist = new THREE.MeshStandardMaterial({ color: '#d8d2c4', roughness: 0.85 });
      const stairTread = new THREE.MeshStandardMaterial({ color: '#ded7c8', roughness: 0.60 });
      const stairRiser = new THREE.MeshStandardMaterial({ color: '#f3efe8', roughness: 0.80 });
      const stairRail = new THREE.MeshStandardMaterial({ color: '#444c53', metalness: 0.80, roughness: 0.20 });
      const stairCap = new THREE.MeshStandardMaterial({ color: '#795436', roughness: 0.70 });
      const stairPost = new THREE.MeshStandardMaterial({ color: '#5e432d', roughness: 0.65 });

      // Inclined Waist Slab underneath steps (space to ground is 100% open, NOT filled solid to ground)
      const waistThick = 0.35;
      const waistDy = h;
      const waistLen = Math.hypot(depth, waistDy);
      const waistAngle = ascendSouth ? -Math.atan2(waistDy, depth) : Math.atan2(waistDy, depth);
      const waistSlab = new THREE.Mesh(new THREE.BoxGeometry(w, waistThick, waistLen), stairWaist);
      waistSlab.position.set((minX + maxX) / 2, (y0 + y1) / 2 - 0.20, (minZ + maxZ) / 2);
      waistSlab.rotation.x = waistAngle;
      waistSlab.receiveShadow = true;
      group.add(waistSlab);

      // Open steps: Individual horizontal treads and vertical risers (not filled to ground)
      const treadThick = 0.08;
      for (let i = 0; i < numSteps; i++) {
        const topY = y0 + (i + 1) * stepH;
        const zCenter = ascendSouth ? (minZ + (i + 0.5) * stepD) : (maxZ - (i + 0.5) * stepD);

        // Bullnose Tread Finish (thickness 0.08 ft, nosing overhang 0.04 ft)
        const tread = new THREE.Mesh(new THREE.BoxGeometry(w + 0.02, treadThick, stepD + 0.04), stairTread);
        tread.position.set((minX + maxX) / 2, topY - treadThick / 2, zCenter);
        tread.receiveShadow = true;
        group.add(tread);

        // Vertical Riser Board (connects tread to tread/waist, not down to ground)
        const riser = new THREE.Mesh(new THREE.BoxGeometry(w, stepH, 0.06), stairRiser);
        const riserZ = ascendSouth ? (minZ + i * stepD) : (maxZ - i * stepD);
        riser.position.set((minX + maxX) / 2, topY - stepH / 2, riserZ);
        riser.receiveShadow = true;
        group.add(riser);

        // Balusters along the inner stair edge
        if (h >= 3.0) {
          const balX = (minX < 26) ? (maxX - 0.10) : (minX + 0.10);
          const balH = 2.80;
          const bal = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, balH, 8), stairRail);
          bal.position.set(balX, topY + balH / 2, zCenter);
          group.add(bal);
        }
      }

      // Handrail along the inner open edge of the flight
      if (h >= 3.0) {
        const railX = (minX < 26) ? (maxX - 0.10) : (minX + 0.10);
        const railRise = h;
        const railSlopeLen = Math.hypot(depth, railRise);
        const handrail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.10, railSlopeLen), stairCap);
        handrail.position.set(railX, (y0 + y1) / 2 + 2.85, (minZ + maxZ) / 2);
        handrail.rotation.x = ascendSouth ? -Math.atan2(railRise, depth) : Math.atan2(railRise, depth);
        group.add(handrail);

        // Newel posts at bottom and top
        const botPost = new THREE.Mesh(new THREE.BoxGeometry(0.12, 3.45, 0.12), stairPost);
        const botZ = ascendSouth ? (minZ + 0.08) : (maxZ - 0.08);
        botPost.position.set(railX, y0 + 3.45 / 2, botZ);
        group.add(botPost);

        const topPost = new THREE.Mesh(new THREE.BoxGeometry(0.12, 3.45, 0.12), stairPost);
        const topZ = ascendSouth ? (maxZ - 0.08) : (minZ + 0.08);
        topPost.position.set(railX, y1 + 3.45 / 2, topZ);
        group.add(topPost);
      }

      return group;
    }

    // Feature #32: Garage Sliding Door (G.S.D) - Architectural modern design with horizontal teak slats, frosted vision inserts, dark metallic frame & stainless handle
    function createGarageSlidingDoor(pts, y0, y1) {
      const group = new THREE.Group();
      const xs = pts.map(p => p[0]), zs = pts.map(p => p[1]);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minZ = Math.min(...zs), maxZ = Math.max(...zs);
      const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2, cy = (y0 + y1) / 2;
      const w = maxX - minX, h = y1 - y0;

      // Materials
      const woodMat = new THREE.MeshStandardMaterial({ color: '#8c5835', roughness: 0.65, metalness: 0.10 });
      const frameMat = new THREE.MeshStandardMaterial({ color: '#2c3136', roughness: 0.35, metalness: 0.75 });
      const glassMat = new THREE.MeshStandardMaterial({ color: '#b9d6e4', roughness: 0.16, metalness: 0.25, side: THREE.DoubleSide });
      const trimMat = new THREE.MeshStandardMaterial({ color: '#1e2226', roughness: 0.40, metalness: 0.85 });
      const handleMat = new THREE.MeshStandardMaterial({ color: '#e6eaee', roughness: 0.15, metalness: 0.95 });

      // Neutral dark interior backing
      const back = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.04), new THREE.MeshStandardMaterial({ color: '#25292e', roughness: 0.85 }));
      back.position.set(cx, cy, cz - 0.12);
      group.add(back);

      // Top heavy-duty sliding track beam
      const track = new THREE.Mesh(new THREE.BoxGeometry(w + 0.60, 0.22, 0.24), trimMat);
      track.position.set(cx, y1 + 0.11, cz);
      group.add(track);

      // Sliding track rollers / brackets
      for (const rx of [minX + 1.2, cx, maxX - 1.2]) {
        const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.28, 0.18), trimMat);
        bracket.position.set(rx, y1 + 0.05, cz + 0.08);
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.10, 12), frameMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(rx, y1 + 0.14, cz + 0.08);
        group.add(bracket, wheel);
      }

      // Outer perimeter door frame
      const frameThick = 0.14, frameDepth = 0.10;
      const topRail = new THREE.Mesh(new THREE.BoxGeometry(w, frameThick, frameDepth), frameMat);
      topRail.position.set(cx, y1 - frameThick / 2, cz);
      const botRail = new THREE.Mesh(new THREE.BoxGeometry(w, frameThick * 1.5, frameDepth), frameMat);
      botRail.position.set(cx, y0 + (frameThick * 1.5) / 2, cz);
      const leftStile = new THREE.Mesh(new THREE.BoxGeometry(frameThick, h, frameDepth), frameMat);
      leftStile.position.set(minX + frameThick / 2, cy, cz);
      const rightStile = new THREE.Mesh(new THREE.BoxGeometry(frameThick, h, frameDepth), frameMat);
      rightStile.position.set(maxX - frameThick / 2, cy, cz);
      group.add(topRail, botRail, leftStile, rightStile);

      // Horizontal Teak Slats with Metal Reveal Joints
      const numSlats = 8;
      const slatH = (h - frameThick * 2.5) / numSlats;
      const innerW = w - frameThick * 2;
      for (let i = 0; i < numSlats; i++) {
        const slatY = y0 + frameThick * 1.5 + (i + 0.5) * slatH;

        if (i === 5) {
          // Vision Glass Row at eye level (slat index 5, ~6.5 to 7.5 ft)
          const numPanes = 4;
          const paneW = (innerW - (numPanes - 1) * 0.12) / numPanes;
          for (let p = 0; p < numPanes; p++) {
            const px = minX + frameThick + p * (paneW + 0.12) + paneW / 2;
            const glassPane = new THREE.Mesh(new THREE.BoxGeometry(paneW, slatH - 0.08, 0.04), glassMat);
            glassPane.position.set(px, slatY, cz + 0.02);
            group.add(glassPane);
            if (p < numPanes - 1) {
              const mull = new THREE.Mesh(new THREE.BoxGeometry(0.12, slatH, 0.06), frameMat);
              mull.position.set(minX + frameThick + (p + 1) * (paneW + 0.12) - 0.06, slatY, cz + 0.02);
              group.add(mull);
            }
          }
        } else {
          // Architectural Warm Teak Wood Slat
          const slat = new THREE.Mesh(new THREE.BoxGeometry(innerW, slatH - 0.04, 0.07), woodMat);
          slat.position.set(cx, slatY, cz + 0.015);
          group.add(slat);

          // Horizontal metal reveal shadow line
          const reveal = new THREE.Mesh(new THREE.BoxGeometry(innerW, 0.03, 0.08), trimMat);
          reveal.position.set(cx, slatY - slatH / 2 + 0.015, cz + 0.015);
          group.add(reveal);
        }
      }

      // Brushed Stainless Steel Vertical Designer Pull Handle (flipped to left side)
      const handleH = 3.60, handleR = 0.035;
      const handleX = minX + 0.65, handleY = y0 + 3.8;
      const handleBar = new THREE.Mesh(new THREE.CylinderGeometry(handleR, handleR, handleH, 16), handleMat);
      handleBar.position.set(handleX, handleY, cz + 0.14);
      for (const dy of [-handleH * 0.42, handleH * 0.42]) {
        const standoff = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.08, 12), handleMat);
        standoff.rotation.x = Math.PI / 2;
        standoff.position.set(handleX, handleY + dy, cz + 0.09);
        group.add(standoff);
      }
      group.add(handleBar);

      return group;
    }

    // Feature #31: Stair-room Collapsible Door (S.C.D) - OPEN (collapsed into two sides against left and right jambs), center completely open
    function createCollapsibleDoor(pts, y0, y1) {
      const group = new THREE.Group();
      // Position moved inside at the same level as sliding gate: X: 24.042 .. 32.727, Z: 34.856 .. 35.362, Y: 2.0 .. 10.0
      const minX = 24.042, maxX = 32.727;
      const minZ = 34.856, maxZ = 35.362;
      const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2, cy = (y0 + y1) / 2;
      const w = maxX - minX, h = y1 - y0;

      const ironMat = new THREE.MeshStandardMaterial({ color: '#2d3339', roughness: 0.35, metalness: 0.85 });
      const brassMat = new THREE.MeshStandardMaterial({ color: '#b59a68', roughness: 0.35, metalness: 0.65 });

      // Top guide track channel across entire span (runs along X)
      const topTrack = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, 0.16), ironMat);
      topTrack.position.set(cx, y1 - 0.06, cz);
      // Bottom guide floor track channel across entire span
      const botTrack = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, 0.16), ironMat);
      botTrack.position.set(cx, y0 + 0.04, cz);
      group.add(topTrack, botTrack);

      // Collapsed Left Leaf (bunched against left jamb, X: 24.042 .. 25.15, width ~1.11 ft)
      const leftStackMinX = minX, leftStackMaxX = minX + 1.15;
      const leftNumBars = 6;
      for (let i = 0; i < leftNumBars; i++) {
        const bx = leftStackMinX + 0.04 + (i / (leftNumBars - 1)) * (leftStackMaxX - leftStackMinX - 0.08);
        const bar = new THREE.Mesh(new THREE.BoxGeometry(0.06, h - 0.16, 0.10), ironMat);
        bar.position.set(bx, cy, cz);
        group.add(bar);
        // Scissor lattice links (tightly folded / steep angle)
        for (const yFrac of [0.25, 0.50, 0.75]) {
          const ly = y0 + 0.08 + yFrac * (h - 0.16);
          const link = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.03, 0.03), ironMat);
          link.rotation.z = (i % 2 === 0 ? 0.75 : -0.75);
          link.position.set(bx, ly, cz);
          const pin = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 8), brassMat);
          pin.position.set(bx, ly, cz + 0.055);
          group.add(link, pin);
        }
      }
      // Left vertical locking end-bar with brass handle
      const leftEndBar = new THREE.Mesh(new THREE.BoxGeometry(0.08, h - 0.16, 0.14), ironMat);
      leftEndBar.position.set(leftStackMaxX, cy, cz);
      const leftHandle = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.40, 0.08), brassMat);
      leftHandle.position.set(leftStackMaxX + 0.05, y0 + 3.2, cz + 0.04);
      group.add(leftEndBar, leftHandle);

      // Collapsed Right Leaf (bunched against right jamb, X: 31.58 .. 32.727, width ~1.15 ft)
      const rightStackMinX = maxX - 1.15, rightStackMaxX = maxX;
      const rightNumBars = 6;
      for (let i = 0; i < rightNumBars; i++) {
        const bx = rightStackMinX + 0.04 + (i / (rightNumBars - 1)) * (rightStackMaxX - rightStackMinX - 0.08);
        const bar = new THREE.Mesh(new THREE.BoxGeometry(0.06, h - 0.16, 0.10), ironMat);
        bar.position.set(bx, cy, cz);
        group.add(bar);
        // Scissor lattice links (tightly folded)
        for (const yFrac of [0.25, 0.50, 0.75]) {
          const ly = y0 + 0.08 + yFrac * (h - 0.16);
          const link = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.03, 0.03), ironMat);
          link.rotation.z = (i % 2 === 0 ? -0.75 : 0.75);
          link.position.set(bx, ly, cz);
          const pin = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 8), brassMat);
          pin.position.set(bx, ly, cz + 0.055);
          group.add(link, pin);
        }
      }
      // Right vertical locking end-bar with brass receiver hasp
      const rightEndBar = new THREE.Mesh(new THREE.BoxGeometry(0.08, h - 0.16, 0.14), ironMat);
      rightEndBar.position.set(rightStackMinX, cy, cz);
      const rightHasp = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.25, 0.08), brassMat);
      rightHasp.position.set(rightStackMinX - 0.05, y0 + 3.2, cz + 0.04);
      group.add(rightEndBar, rightHasp);

      return group;
    }

    // Feature #41: Concrete Ramp (in front of Garage Sliding Door) - Non-slip grooved concrete ramp with side safety curbs
    function createRampMesh(pts, y0, y1) {
      const group = new THREE.Group();
      // Ramp spans full garage opening: X from 1.043 to 12.322
      // Slopes up from driveway (y0 = 0.0 at front facade line Z = 39.001) to garage door threshold (y1 = 2.0 at Z = 35.362)
      const minX = 1.043, maxX = 12.322;
      const minZ = 35.362, maxZ = 39.001;
      const w = maxX - minX;

      const rampMaterial = new THREE.MeshStandardMaterial({
        color: '#c2bcaf',
        roughness: 0.90,
        side: THREE.DoubleSide
      });
      const curbMaterial = new THREE.MeshStandardMaterial({
        color: '#d5cfc2',
        roughness: 0.92
      });

      // Solid wedge geometry with outward-pointing normals (pointing UP +Y and OUT +Z)
      const rampPositions = [
        // Top inclined surface (CCW normal pointing UP and SOUTH)
        minX, y1, minZ, minX, y0, maxZ, maxX, y0, maxZ,
        minX, y1, minZ, maxX, y0, maxZ, maxX, y1, minZ,
        // Bottom flat surface
        minX, y0, minZ, maxX, y0, minZ, maxX, y0, maxZ,
        minX, y0, minZ, maxX, y0, maxZ, minX, y0, maxZ,
        // Back vertical face at minZ (garage threshold)
        minX, y0, minZ, maxX, y0, minZ, maxX, y1, minZ,
        minX, y0, minZ, maxX, y1, minZ, minX, y1, minZ,
        // Left triangular side
        minX, y0, minZ, minX, y0, maxZ, minX, y1, minZ,
        // Right triangular side
        maxX, y0, minZ, maxX, y1, minZ, maxX, y0, maxZ
      ];

      const rampGeom = new THREE.BufferGeometry();
      rampGeom.setAttribute('position', new THREE.Float32BufferAttribute(rampPositions, 3));
      rampGeom.computeVertexNormals();
      const ramp = new THREE.Mesh(rampGeom, rampMaterial);
      group.add(ramp);

      // Non-slip transverse grooves along the ramp surface
      const numGrooves = 8;
      const grooveMat = new THREE.MeshStandardMaterial({ color: '#aba497', roughness: 0.85 });
      const slopeAngle = -Math.atan2(y1 - y0, maxZ - minZ);
      for (let g = 1; g <= numGrooves; g++) {
        const frac = g / (numGrooves + 1);
        const gz = minZ + frac * (maxZ - minZ);
        const gy = y1 - frac * (y1 - y0);
        const groove = new THREE.Mesh(new THREE.BoxGeometry(w - 0.40, 0.025, 0.06), grooveMat);
        groove.position.set((minX + maxX) / 2, gy + 0.015, gz);
        groove.rotation.x = slopeAngle;
        group.add(groove);
      }

      // Left & Right Safety Curbs along ramp sides
      const curbW = 0.22, curbH = 0.35;
      // Left curb
      const leftCurbPos = [
        minX - curbW, y1 + curbH, minZ, minX - curbW, y0 + curbH, maxZ, minX, y0 + curbH, maxZ,
        minX - curbW, y1 + curbH, minZ, minX, y0 + curbH, maxZ, minX, y1 + curbH, minZ,
        minX - curbW, y0, minZ, minX, y0, minZ, minX, y1 + curbH, minZ,
        minX - curbW, y0, minZ, minX, y1 + curbH, minZ, minX - curbW, y1 + curbH, minZ,
        minX - curbW, y0, minZ, minX - curbW, y0, maxZ, minX - curbW, y0 + curbH, maxZ,
        minX - curbW, y0, minZ, minX - curbW, y0 + curbH, maxZ, minX - curbW, y1 + curbH, minZ,
      ];
      const leftGeom = new THREE.BufferGeometry();
      leftGeom.setAttribute('position', new THREE.Float32BufferAttribute(leftCurbPos, 3));
      leftGeom.computeVertexNormals();
      group.add(new THREE.Mesh(leftGeom, curbMaterial));

      // Right curb
      const rightCurbPos = [
        maxX, y1 + curbH, minZ, maxX, y0 + curbH, maxZ, maxX + curbW, y0 + curbH, maxZ,
        maxX, y1 + curbH, minZ, maxX + curbW, y0 + curbH, maxZ, maxX + curbW, y1 + curbH, minZ,
        maxX, y0, minZ, maxX + curbW, y0, minZ, maxX + curbW, y1 + curbH, minZ,
        maxX, y0, minZ, maxX + curbW, y1 + curbH, minZ, maxX, y1 + curbH, minZ,
        maxX + curbW, y0, minZ, maxX + curbW, y1 + curbH, minZ, maxX + curbW, y0 + curbH, maxZ,
        maxX + curbW, y0, minZ, maxX + curbW, y0 + curbH, maxZ, maxX + curbW, y0, maxZ,
      ];
      const rightGeom = new THREE.BufferGeometry();
      rightGeom.setAttribute('position', new THREE.Float32BufferAttribute(rightCurbPos, 3));
      rightGeom.computeVertexNormals();
      group.add(new THREE.Mesh(rightGeom, curbMaterial));

      return group;
    }

    // Feature #45: Entry Steps (in front of Stair Collapsible Door) - Elegant light stone steps ascending towards gate (NOT black)
    function createEntranceStepsMesh(pts, y0, y1) {
      const group = new THREE.Group();
      // Steps are positioned directly in front of the moved collapsible gate:
      // Gate is at minZ = 35.362. Outer entrance apron is at maxZ = 38.800.
      // Width spans X: 24.042 .. 32.727
      const minX = 24.042, maxX = 32.727;
      const minZ = 35.362, maxZ = 38.800;
      const w = maxX - minX, depth = maxZ - minZ;

      // Elegant architectural light stone materials (NOT black)
      const treadMat = new THREE.MeshStandardMaterial({ color: '#ded7c8', roughness: 0.55 });
      const riserMat = new THREE.MeshStandardMaterial({ color: '#eeeae1', roughness: 0.75 });
      const nosingMat = new THREE.MeshStandardMaterial({ color: '#c5beb1', roughness: 0.50 });

      // 3 steps rising from ground level (y0 = 0.0 at maxZ = 37.841) up to gate threshold (y1 = 2.0 at minZ = 35.362)
      const numSteps = 3;
      const stepDepth = depth / numSteps;
      const stepRise = (y1 - y0) / numSteps;

      for (let i = 0; i < numSteps; i++) {
        // Step 0 is outermost (closest to street, maxZ), Step 2 is innermost (landing at gate threshold, minZ)
        const stepZ_front = maxZ - i * stepDepth;
        const stepH = (i + 1) * stepRise;
        const treadZ_start = maxZ - (i + 1) * stepDepth;
        const treadZ_end = maxZ - i * stepDepth;

        // Solid light stone base block supporting this step and everything behind it
        const block = new THREE.Mesh(
          new THREE.BoxGeometry(w, stepRise, treadZ_end - treadZ_start),
          riserMat
        );
        block.position.set((minX + maxX) / 2, y0 + (i + 0.5) * stepRise, (treadZ_start + treadZ_end) / 2);
        group.add(block);

        // If i > 0, solid riser filler under previous steps back to gate
        if (i > 0) {
          const fill = new THREE.Mesh(
            new THREE.BoxGeometry(w, i * stepRise, treadZ_end - treadZ_start),
            riserMat
          );
          fill.position.set((minX + maxX) / 2, y0 + (i * stepRise) / 2, (treadZ_start + treadZ_end) / 2);
          group.add(fill);
        }

        // Bullnose Light Stone Tread Cap with slight overhang and rounded edge
        const treadCap = new THREE.Mesh(
          new THREE.BoxGeometry(w + 0.04, 0.05, (treadZ_end - treadZ_start) + 0.04),
          treadMat
        );
        treadCap.position.set((minX + maxX) / 2, y0 + stepH + 0.025, (treadZ_start + treadZ_end) / 2 + 0.01);
        group.add(treadCap);

        // Non-slip nosing trim at step edge
        const nosing = new THREE.Mesh(
          new THREE.BoxGeometry(w + 0.04, 0.015, 0.04),
          nosingMat
        );
        nosing.position.set((minX + maxX) / 2, y0 + stepH + 0.05, treadZ_end + 0.01);
        group.add(nosing);
      }

      return group;
    }


    // Door builder for roof terrace
    function createTerraceDoor(pts, y0, y1) {
      const group = new THREE.Group();
      const xs = pts.map(p => p[0]), zs = pts.map(p => p[1]);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minZ = Math.min(...zs), maxZ = Math.max(...zs);
      const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2, cy = (y0 + y1) / 2;
      const w = Math.max(0.1, maxX - minX), d = Math.max(0.1, maxZ - minZ), h = y1 - y0;

      const doorLeafMat = new THREE.MeshStandardMaterial({ color: '#4a3828', roughness: 0.55 });
      if (w >= d) {
        const leaf = new THREE.Mesh(new THREE.BoxGeometry(w - 0.08, h - 0.08, 0.08), doorLeafMat);
        leaf.position.set(cx, cy, cz);
        group.add(leaf);
      } else {
        const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.08, h - 0.08, d - 0.08), doorLeafMat);
        leaf.position.set(cx, cy, cz);
        group.add(leaf);
      }
      return group;
    }

    // Slab Builder: Builds horizontal floor/ceiling slabs

        [0.0, 39.001, 8.895, 39.608],
        [33.234, 39.001, 47.812, 39.009],
        [47.812, 39.001, 56.684, 39.585]
      ];
      const positions = [];
      const h = y1 - y0;
      for (const [x0, z0, x1, z1] of slabQuads) {
        // Top face
        positions.push(
          x0, y1, z0, x0, y1, z1, x1, y1, z1,
          x0, y1, z0, x1, y1, z1, x1, y1, z0,
          // Bottom face
          x0, y0, z0, x1, y0, z1, x0, y0, z1,
          x0, y0, z0, x1, y0, z0, x1, y0, z1,
          // 4 side faces
          x0, y0, z0, x0, y1, z0, x1, y1, z0,
          x0, y0, z0, x1, y1, z0, x1, y0, z0,

          x0, y0, z1, x1, y1, z1, x0, y1, z1,
          x0, y0, z1, x1, y0, z1, x1, y1, z1,

          x0, y0, z0, x0, y0, z1, x0, y1, z1,
          x0, y0, z0, x0, y1, z1, x0, y1, z0,

          x1, y0, z0, x1, y1, z1, x1, y0, z1,
          x1, y0, z0, x1, y1, z0, x1, y1, z1
        );
      }
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.computeVertexNormals();

    // =========================================================================

    // =========================================================================
    function createMeterBox(cx = 19.35, cy = 5.90, cz = 37.841, w = 5.60, h = 5.60, d = 0.65) {
      const group = new THREE.Group();
      group.name = 'meterBoxCabinet';

      // Materials
      const steelMat = new THREE.MeshStandardMaterial({

      });
      const trimMat = new THREE.MeshStandardMaterial({

        metalness: 0.80
      });
      const backboardMat = new THREE.MeshStandardMaterial({
        color: '#d6d2c4', // Insulated electrical backboard
