        emissive: '#0d2417',
        emissiveIntensity: 0.4
      });
      const lcdDigitMat = new THREE.MeshStandardMaterial({
        color: '#55efc4', // Greenish-cyan digital display segments
        emissive: '#00b894',
        emissiveIntensity: 0.8
      });
      const redLedMat = new THREE.MeshStandardMaterial({
        color: '#ff4757',
        emissive: '#ff4757',
        emissiveIntensity: 0.9
      });
      const greenLedMat = new THREE.MeshStandardMaterial({
        color: '#2ed573',
        emissive: '#2ed573',
        emissiveIntensity: 0.9
      });
      const trunkingMat = new THREE.MeshStandardMaterial({
        color: '#7f8c8d', // Grey PVC wire conduits/trunking
        roughness: 0.50
      });
      const mcbMat = new THREE.MeshStandardMaterial({
        color: '#dfe6e9', // Miniature circuit breaker housing
        roughness: 0.45
      });
      const mcbSwitchMat = new THREE.MeshStandardMaterial({
        color: '#e67e22', // Orange trip switch toggle
        roughness: 0.30
      });
      const doorGlassMat = new THREE.MeshStandardMaterial({
        color: '#e4f1fe', // High transparency front door inspection window
        roughness: 0.08,
        metalness: 0.15,
        transparent: true,
        opacity: 0.45,
        side: THREE.DoubleSide
      });
      const chromeMat = new THREE.MeshStandardMaterial({
        color: '#e0e0e0',
        metalness: 0.90,
        roughness: 0.15
      });
      const dangerYellowMat = new THREE.MeshStandardMaterial({
        color: '#f1c40f', // Hazard warning yellow plate
        roughness: 0.35
      });
      const dangerBlackMat = new THREE.MeshStandardMaterial({
        color: '#111111',
        roughness: 0.50
      });

      const halfW = w / 2, halfH = h / 2;
      const frontZ = cz + d;
      const midZ = cz + d / 2;

      // 1. Outer Steel Cabinet Box (Top, Bottom, Sides, Back)
      // Back plate
      const backPlate = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.04), steelMat);
      backPlate.position.set(cx, cy, cz + 0.02);
      group.add(backPlate);

      // Backboard mounting plate
      const backBoard = new THREE.Mesh(new THREE.BoxGeometry(w - 0.20, h - 0.20, 0.02), backboardMat);
      backBoard.position.set(cx, cy, cz + 0.05);
      group.add(backBoard);

      // Top rain canopy (angled roof overhang to shield from rain)
      const topCanopy = new THREE.Mesh(new THREE.BoxGeometry(w + 0.30, 0.10, d + 0.18), trimMat);
      topCanopy.position.set(cx, cy + halfH + 0.05, cz + (d + 0.18) / 2);
      topCanopy.rotation.x = 0.06;
      group.add(topCanopy);

      // Bottom shelf
      const bottomShelf = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, d), steelMat);
      bottomShelf.position.set(cx, cy - halfH + 0.04, midZ);
      group.add(bottomShelf);

      // Left & Right side walls
      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.08, h, d), steelMat);
      leftWall.position.set(cx - halfW + 0.04, cy, midZ);
      const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.08, h, d), steelMat);
      rightWall.position.set(cx + halfW - 0.04, cy, midZ);
      group.add(leftWall, rightWall);

      // Top cabinet header beam with Danger Warning Plate
      const topHeader = new THREE.Mesh(new THREE.BoxGeometry(w, 0.30, d), steelMat);
      topHeader.position.set(cx, cy + halfH - 0.15, midZ);
      group.add(topHeader);

      // Hazard Warning Plate on header: DANGER 415V
      const warningPlate = new THREE.Mesh(new THREE.BoxGeometry(1.20, 0.18, 0.02), dangerYellowMat);
      warningPlate.position.set(cx, cy + halfH - 0.15, frontZ + 0.015);
      const lightningSymbol = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.08, 0.03), dangerBlackMat);
      lightningSymbol.position.set(cx, cy + halfH - 0.15, frontZ + 0.02);
      lightningSymbol.rotation.z = 0.55;
      group.add(warningPlate, lightningSymbol);

      // 2. Interior Electrical Installation: 8 Organised Electricity Meters
      // Arranged in 2 rows x 4 columns
      const cols = 4;
      const rows = 2;
      const colSpacing = 1.18;
      const rowSpacing = 2.15;
      const startX = cx - ((cols - 1) * colSpacing) / 2;
      const startY = cy + 0.65;
      const meterZ = cz + 0.16;

      // Horizontal PVC wire trunking channels
      const topTrunking = new THREE.Mesh(new THREE.BoxGeometry(w - 0.30, 0.10, 0.08), trunkingMat);
      topTrunking.position.set(cx, startY + 0.95, cz + 0.10);
      const midTrunking = new THREE.Mesh(new THREE.BoxGeometry(w - 0.30, 0.10, 0.08), trunkingMat);
      midTrunking.position.set(cx, cy - 0.35, cz + 0.10);
      const bottomTrunking = new THREE.Mesh(new THREE.BoxGeometry(w - 0.30, 0.10, 0.08), trunkingMat);
      bottomTrunking.position.set(cx, startY - rowSpacing - 0.95, cz + 0.10);
      group.add(topTrunking, midTrunking, bottomTrunking);

      // Build 8 Digital Electricity Meters
      for (let r = 0; r < rows; r++) {
        const my = startY - r * rowSpacing;
        for (let c = 0; c < cols; c++) {
          const mx = startX + c * colSpacing;

          // Vertical wire conduit to the meter
          const vConduit = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.30, 0.06), trunkingMat);
          vConduit.position.set(mx, my + 0.80, cz + 0.10);
          group.add(vConduit);

          // Meter Main Body
          const mW = 0.82, mH = 1.22, mD = 0.18;
          const meterBody = new THREE.Mesh(new THREE.BoxGeometry(mW, mH, mD), meterBodyMat);
          meterBody.position.set(mx, my, meterZ);
          group.add(meterBody);

          // Meter Nameplate / Header Strip
          const headerPlate = new THREE.Mesh(new THREE.BoxGeometry(mW - 0.08, 0.16, 0.02), trimMat);
          headerPlate.position.set(mx, my + mH / 2 - 0.12, meterZ + mD / 2 + 0.01);
          group.add(headerPlate);

          // Digital LCD Screen
          const lcd = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.24, 0.02), lcdScreenMat);
          lcd.position.set(mx, my + 0.20, meterZ + mD / 2 + 0.015);
          // Digital digits line
          const digits = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.07, 0.025), lcdDigitMat);
          digits.position.set(mx - 0.04, my + 0.20, meterZ + mD / 2 + 0.02);
          group.add(lcd, digits);

          // Pulse & Power Indicator LEDs
          const redLed = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), redLedMat);
          redLed.position.set(mx + 0.18, my + 0.22, meterZ + mD / 2 + 0.02);
          const grnLed = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), greenLedMat);
          grnLed.position.set(mx + 0.18, my + 0.16, meterZ + mD / 2 + 0.02);
          group.add(redLed, grnLed);

          // Transparent / Smoked Terminal Cover
          const termCover = new THREE.Mesh(new THREE.BoxGeometry(mW - 0.04, 0.44, 0.08), meterGlassCoverMat);
          termCover.position.set(mx, my - mH / 2 + 0.24, meterZ + mD / 2 + 0.03);
          // Brass terminal seal screw
          const brassSeal = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.03, 8), chromeMat);
          brassSeal.rotation.x = Math.PI / 2;
          brassSeal.position.set(mx, my - mH / 2 + 0.24, meterZ + mD / 2 + 0.075);
          group.add(termCover, brassSeal);

          // Dedicated Miniature Circuit Breaker (MCB) below each meter
          const mcbBox = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.32, 0.12), mcbMat);
          mcbBox.position.set(mx, my - mH / 2 - 0.22, meterZ + 0.02);
          const mcbSwitch = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.10, 0.08), mcbSwitchMat);
          mcbSwitch.position.set(mx, my - mH / 2 - 0.22, meterZ + 0.10);
          group.add(mcbBox, mcbSwitch);
        }
      }

      // 3. Main Incoming 3-Phase Isolator / MCCB in central bottom area
      const mccb = new THREE.Mesh(new THREE.BoxGeometry(0.70, 0.50, 0.22), trimMat);
      mccb.position.set(cx, cy - halfH + 0.45, meterZ + 0.02);
      const mccbHandle = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.24, 0.10), redLedMat);
      mccbHandle.position.set(cx, cy - halfH + 0.45, meterZ + 0.16);
      group.add(mccb, mccbHandle);

      // 4. Cabinet Double Doors with Clear Glass Windows
      // Dividing central mullion
      const centerMullion = new THREE.Mesh(new THREE.BoxGeometry(0.08, h - 0.38, 0.08), trimMat);
      centerMullion.position.set(cx, cy - 0.15, frontZ);
      group.add(centerMullion);

      // Left Door Frame & Clear Inspection Glass
      const doorW = (w - 0.24) / 2;
      const doorH = h - 0.42;
      const leftDoorX = cx - doorW / 2 - 0.04;
      const rightDoorX = cx + doorW / 2 + 0.04;
      const doorY = cy - 0.15;

      const frameThick = 0.08;
      // Left door outer frame
      const leftDoorFrameTop = new THREE.Mesh(new THREE.BoxGeometry(doorW, frameThick, 0.06), steelMat);
      leftDoorFrameTop.position.set(leftDoorX, doorY + doorH / 2 - frameThick / 2, frontZ);
      const leftDoorFrameBottom = new THREE.Mesh(new THREE.BoxGeometry(doorW, frameThick, 0.06), steelMat);
      leftDoorFrameBottom.position.set(leftDoorX, doorY - doorH / 2 + frameThick / 2, frontZ);
      const leftDoorFrameLeft = new THREE.Mesh(new THREE.BoxGeometry(frameThick, doorH, 0.06), steelMat);
      leftDoorFrameLeft.position.set(leftDoorX - doorW / 2 + frameThick / 2, doorY, frontZ);
      const leftDoorFrameRight = new THREE.Mesh(new THREE.BoxGeometry(frameThick, doorH, 0.06), steelMat);
      leftDoorFrameRight.position.set(leftDoorX + doorW / 2 - frameThick / 2, doorY, frontZ);
      // Left inspection glass
      const leftGlass = new THREE.Mesh(new THREE.BoxGeometry(doorW - frameThick * 2, doorH - frameThick * 2, 0.015), doorGlassMat);
      leftGlass.position.set(leftDoorX, doorY, frontZ);
      group.add(leftDoorFrameTop, leftDoorFrameBottom, leftDoorFrameLeft, leftDoorFrameRight, leftGlass);

      // Right door outer frame & inspection glass
      const rightDoorFrameTop = new THREE.Mesh(new THREE.BoxGeometry(doorW, frameThick, 0.06), steelMat);
      rightDoorFrameTop.position.set(rightDoorX, doorY + doorH / 2 - frameThick / 2, frontZ);
      const rightDoorFrameBottom = new THREE.Mesh(new THREE.BoxGeometry(doorW, frameThick, 0.06), steelMat);
      rightDoorFrameBottom.position.set(rightDoorX, doorY - doorH / 2 + frameThick / 2, frontZ);
      const rightDoorFrameLeft = new THREE.Mesh(new THREE.BoxGeometry(frameThick, doorH, 0.06), steelMat);
      rightDoorFrameLeft.position.set(rightDoorX - doorW / 2 + frameThick / 2, doorY, frontZ);
      const rightDoorFrameRight = new THREE.Mesh(new THREE.BoxGeometry(frameThick, doorH, 0.06), steelMat);
      rightDoorFrameRight.position.set(rightDoorX + doorW / 2 - frameThick / 2, doorY, frontZ);
      const rightGlass = new THREE.Mesh(new THREE.BoxGeometry(doorW - frameThick * 2, doorH - frameThick * 2, 0.015), doorGlassMat);
      rightGlass.position.set(rightDoorX, doorY, frontZ);
      group.add(rightDoorFrameTop, rightDoorFrameBottom, rightDoorFrameLeft, rightDoorFrameRight, rightGlass);

      // Industrial Hardware: Heavy-duty Hinges & Center Stainless Handle Lock
      for (const hy of [doorY + doorH / 3, doorY - doorH / 3]) {
        const leftHinge = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.12, 8), chromeMat);
        leftHinge.position.set(cx - halfW + 0.08, hy, frontZ + 0.03);
        const rightHinge = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.12, 8), chromeMat);
        rightHinge.position.set(cx + halfW - 0.08, hy, frontZ + 0.03);
        group.add(leftHinge, rightHinge);
      }
      // Center locking latch & T-handle
      const lockLatch = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.18, 0.04), chromeMat);
      lockLatch.position.set(cx, doorY, frontZ + 0.04);
      const lockHandle = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.22, 0.06), chromeMat);
      lockHandle.position.set(cx + 0.04, doorY, frontZ + 0.07);
      group.add(lockLatch, lockHandle);

      return group;
    }

    function buildGroundFloor() {
      const group = new THREE.Group();
      group.name = 'groundFloor';

      // Foundation plinth slab (cut out left & right front extensions so facade line is clean flush at Z = 39.001)
      const groundPlinthQuads = [
        [0.0, 0.0, 56.684, 17.2],
        [0.0, 17.2, 56.684, 39.001]
      ];
      group.add(createSlabMesh(0.0, 0.4, bldgPlinthMat, groundPlinthQuads));
      // Ceiling slab at 12 ft
      group.add(createSlabMesh(11.8, 12.0, bldgPlinthMat));

      // Raised stair-room interior floor slab of 2 ft height (for both Current and Complete)
      // Slab stops at the moved collapsible gate (Z = 34.856), stair room bounds: X: 24.04 .. 32.73, Z: 17.47 .. 34.856, Y: 0.0 .. 2.0
      const stairSlab = new THREE.Mesh(
        new THREE.BoxGeometry(32.73 - 24.04, 2.0, 34.856 - 17.47),
        bldgPlinthMat
      );
      stairSlab.position.set((24.04 + 32.73) / 2, 1.0, (17.47 + 34.856) / 2);
      group.add(stairSlab);

      // Wall header beam above moved collapsible gate at Z = 34.856 .. 35.362 from Y = 10.0 to 12.0
      const scdHeaderPts = [[24.042, 34.856], [32.727, 34.856], [32.727, 35.362], [24.042, 35.362]];
      group.add(createPrismMesh(scdHeaderPts, 10.0, 12.0, wallMatExterior));

      // Entrance portal lintel beam at outer facade Z = 37.335 .. 37.841 from Y = 10.0 to 12.0
      const porchLintelPts = [[24.042, 37.335], [32.727, 37.335], [32.727, 37.841], [24.042, 37.841]];
      group.add(createPrismMesh(porchLintelPts, 10.0, 12.0, wallMatExterior));

      // Solid cantilever beam under 1st floor stair-room window (Z = 37.841 .. 39.0511, Y = 10.0 .. 12.0)
      // Spans full entrance width flush with 1st floor front facade wall
      const frontEntranceBeam = [[23.535, 37.841], [33.234, 37.841], [33.234, 39.0511], [23.535, 39.0511]];
      group.add(createPrismMesh(frontEntranceBeam, 10.0, 12.0, wallMatExterior));

      // Moved open collapsible door (at Z = 34.856 .. 35.362)
      group.add(createCollapsibleDoor(scdHeaderPts, 2.0, 10.0));

      // Fixed entrance steps (at Z = 35.362 .. 37.841, ascending inwards, light stone)
      group.add(createEntranceStepsMesh(porchLintelPts, 0.0, 2.0));

      // Prominent garage access ramp (slopes from Y = 2.0 at Z = 35.362 down to Y = 0.0 at Z = 38.60)
      group.add(createRampMesh([], 0.0, 2.0));

      // Architectural Electricity Meter Box on ground floor exterior facade
      group.add(createMeterBox(19.35, 5.90, 37.841, 5.60, 5.60, 0.65));

      const baseElevation = 0.0;
      for (const feat of GROUND_FEATURES) {
        const pts = feat.pts;
        if (!pts || pts.length < 3 || feat.type === 'Out') continue;
        // Skip old ground entrance transom wall / window overhangs (Features 39, 43, 44) to eliminate tiny extensions
        if (feat.id === 39 || feat.id === 43 || feat.id === 44) continue;

        if (feat.type === '') {
          const h = feat.h || 12.0;
          const y0 = baseElevation + (feat.ah || 0);
          group.add(createPrismMesh(pts, y0, y0 + h, wallMatExterior));
        } else if (feat.type === 'W') {
          const y0 = baseElevation + (feat.ah || 0);
          if (feat.id === 43) {
            // Ground floor stair-room transom window removed and filled with wall
            group.add(createPrismMesh(pts, y0, y0 + feat.h, wallMatExterior));
            continue;
          }
          if (feat.lw > 0.01) group.add(createPrismMesh(pts, y0, y0 + feat.lw, wallMatExterior));
          if (feat.hw > 0.01) group.add(createPrismMesh(pts, y0 + feat.lw + feat.h, y0 + feat.lw + feat.h + feat.hw, wallMatExterior));
          group.add(createOpaqueWindow(pts, y0 + feat.lw, y0 + feat.lw + feat.h));
        } else if (feat.type === 'G') {
          const y0 = baseElevation;
          if (feat.lw > 0.01) group.add(createPrismMesh(pts, y0, y0 + feat.lw, wallMatExterior));
          if (feat.hw > 0.01) group.add(createPrismMesh(pts, y0 + feat.lw + feat.h, y0 + feat.lw + feat.h + feat.hw, wallMatExterior));
          group.add(createGrillMesh(pts, y0 + feat.lw, y0 + feat.lw + feat.h));
        } else if (feat.type === 'D') {
          const y0 = baseElevation + (feat.ah || 0);
          if (feat.id === 54) {
            // Garage to ground stair-room door: remove door leaf, only keep door opening
            if (feat.hw > 0.01) group.add(createPrismMesh(pts, y0 + feat.lw + feat.h, y0 + feat.lw + feat.h + feat.hw, wallMatExterior));
            continue;
          }
          if (feat.lw > 0.01) group.add(createPrismMesh(pts, y0, y0 + feat.lw, wallMatExterior));
          if (feat.hw > 0.01) group.add(createPrismMesh(pts, y0 + feat.lw + feat.h, y0 + feat.lw + feat.h + feat.hw, wallMatExterior));
          // Ground floor left door (feat 52) and backside balcony doors (feat 59 & 62) flip the door lock
          const flipLock = (feat.id === 52 || feat.id === 59 || feat.id === 62);
          group.add(createClosedDoor(pts, y0 + feat.lw, y0 + feat.lw + feat.h, { flipLock }));
        } else if (feat.type === 'S') {
          const y0 = baseElevation + (feat.ah || 0);
          if (feat.id === 50) {
            // Landing slab at top of long stair flight: elevation set to 10.5 ft
            // Truncate to Z <= 37.335 to stay inside stair room (remove out extension marked in red)
            const landingPts = [[24.042, 34.328], [32.727, 34.328], [32.727, 37.335], [24.042, 37.335]];
            group.add(createPrismMesh(landingPts, 10.17, 10.50, bldgPlinthMat));
            continue;
          }
          if (feat.id === 50) {
            // Landing slab at top of long stair flight: elevation set to 10.5 ft
            group.add(createPrismMesh(pts, 10.17, 10.50, bldgPlinthMat));
            continue;
          }
          group.add(createPrismMesh(pts, y0, y0 + feat.h, bldgPlinthMat));
        } else if (feat.type === 'stair') {
          const y0 = baseElevation + (feat.ah || 0);
          if (feat.id === 51) {
            // Long stair flight (with railing): rise from 3.0 ft to 10.5 ft (top set to 10.5 ft)
            group.add(createStairMesh(pts, 3.0, 10.5));
            continue;
          }
          if (feat.id === 55) {
            // Upper flight pushed to: from 10.5 ft to 12.0 ft
            group.add(createStairMesh(pts, 10.5, 12.0));
            continue;
          }
          group.add(createStairMesh(pts, y0, y0 + feat.h));
        } else if (feat.type === 'G.S.D') {
          if (feat.hw > 0.01) group.add(createPrismMesh(pts, 10.0, 12.0, wallMatExterior));
          group.add(createGarageSlidingDoor(pts, 2.0, 10.0));
        } else if (feat.type === 'S.C.D' || feat.type === 'Ramp' || feat.type === 'Stair') {
          // Handled explicitly above with updated positions and alignments
          continue;
        }
      }
      return group;
    }

    // BUILD FIRST FLOOR
    function buildFirstFloor() {
      const group = new THREE.Group();
      group.name = 'firstFloor';

      // 1st floor floor slab and 2nd floor base slab
      group.add(createSlabMesh(12.0, 12.3, bldgPlinthMat));
      group.add(createSlabMesh(21.8, 22.0, bldgPlinthMat));

      const baseElevation = 12.0;
      for (const feat of FIRST_FEATURES) {
        const pts = feat.pts;
        if (!pts || pts.length < 3 || feat.type === 'Out') continue;

        if (feat.type === '') {
          if (feat.id === 22) {
            // West bedroom front wall (full height 12 to 22 ft) - outer facade at Z = 39.0511 flush with 2nd floor
            const bedWall = [[19.288, 38.495], [23.535, 38.495], [23.535, 39.0511], [19.288, 39.0511]];
            group.add(createPrismMesh(bedWall, baseElevation, baseElevation + 10.0, wallMatExterior));
            // Stair-room west front wall (12 to 18 ft) - FLAT to match side room wall level (blue part flat)
            const flatWestWall = [[23.535, 38.495], [25.932, 38.495], [25.932, 39.0511], [23.535, 39.0511]];
            group.add(createPrismMesh(flatWestWall, baseElevation, baseElevation + 6.0, wallMatExterior));
            continue;
          }
          if (feat.id === 23) {
            // East bedroom front wall (full height 12 to 22 ft) - outer facade at Z = 39.0511 flush with 2nd floor
            const bedWall = [[33.234, 38.503], [37.449, 38.503], [37.449, 39.0511], [33.234, 39.0511]];
            group.add(createPrismMesh(bedWall, baseElevation, baseElevation + 10.0, wallMatExterior));
            // Stair-room east front wall (12 to 18 ft) - FLAT to match side room wall level (blue part flat)
            const flatEastWall = [[30.83, 38.503], [33.234, 38.503], [33.234, 39.0511], [30.83, 39.0511]];
            group.add(createPrismMesh(flatEastWall, baseElevation, baseElevation + 6.0, wallMatExterior));
            continue;
          }
          const h = feat.h || 10.0;
          group.add(createPrismMesh(pts, baseElevation, baseElevation + h, wallMatExterior));
        } else if (feat.type === 'W') {
          if (feat.id === 0) {
            // 1st floor stair-room front window: FLAT at Z = 38.495 .. 39.0511 from 12.3 to 18 ft (blue part flat)
            const flatWinPts = [[25.932, 38.495], [30.83, 38.503], [30.83, 39.0511], [25.932, 39.0511]];
            // Exterior wall sill from 12.0 to 12.3 ft enclosing the slab edge so no gray notch is exposed below window
            group.add(createPrismMesh(flatWinPts, baseElevation, baseElevation + 0.3, wallMatExterior));
            group.add(createOpaqueWindow(flatWinPts, baseElevation + 0.3, baseElevation + 6.0));

            // RED PART EXTENDED: wall from window top (18 ft) to 2nd floor (22 ft) extends forward to Z = 39.616 as it was originally
            const redPartExtended = [[23.535, 38.495], [33.234, 38.503], [33.234, 39.616], [23.535, 39.616]];
            group.add(createPrismMesh(redPartExtended, baseElevation + 6.0, baseElevation + 10.0, wallMatExterior));
            continue;
          }
          if (feat.lw > 0.01) group.add(createPrismMesh(pts, baseElevation, baseElevation + feat.lw, wallMatExterior));
          if (feat.hw > 0.01) group.add(createPrismMesh(pts, baseElevation + feat.lw + feat.h, baseElevation + 10.0, wallMatExterior));
          group.add(createOpaqueWindow(pts, baseElevation + feat.lw, baseElevation + feat.lw + feat.h));
        } else if (feat.type === 'G') {
          if (feat.lw > 0.01) group.add(createPrismMesh(pts, baseElevation, baseElevation + feat.lw, wallMatExterior));
          if (feat.hw > 0.01) group.add(createPrismMesh(pts, baseElevation + feat.lw + feat.h, baseElevation + 10.0, wallMatExterior));
          group.add(createGrillMesh(pts, baseElevation + feat.lw, baseElevation + feat.lw + feat.h));
        } else if (feat.type === 'D') {
          if (feat.lw > 0.01) group.add(createPrismMesh(pts, baseElevation, baseElevation + feat.lw, wallMatExterior));
          if (feat.hw > 0.01) group.add(createPrismMesh(pts, baseElevation + feat.lw + feat.h, baseElevation + 10.0, wallMatExterior));
          // Backside balcony doors (feat 40 & 41) flip the door lock
          const flipLock = (feat.id === 40 || feat.id === 41);
          group.add(createClosedDoor(pts, baseElevation + feat.lw, baseElevation + feat.lw + feat.h, { flipLock }));
        }
      }
      return group;
    }

    // ROOFTOP STAIR-ROOM PORTION (Headroom cabin / mumty room from building_layout_third.geojson)
    // Features 0 to 3: Feature 0 (Door), Feature 1 (West wall), Feature 2 (East wall), Feature 3 (North window)
    // roomHeight: 3.0 ft for Current view, 10.0 ft for Complete view
    function buildStairRoomPortion(baseY = 42.0, roomHeight = 10.0) {
      const stairRoom = new THREE.Group();
      stairRoom.name = 'rooftopStairRoom';

      for (let i = 0; i <= 3; i++) {
        const feat = THIRD_FEATURES[i];
        if (!feat || !feat.pts || feat.pts.length < 3) continue;
        const pts = feat.pts;

        if (feat.type === 'D') {
          if (roomHeight <= 3.5) {
            // Current view: rooftop stair-room door removed and filled with wall
            stairRoom.add(createPrismMesh(pts, baseY, baseY + roomHeight, wallMatExterior));
          } else {
            // Roof stair-room door: solid color with flipped lock (7 ft) + wall above (7 to 10 ft)
            stairRoom.add(createPrismMesh(pts, baseY + 7.0, baseY + roomHeight, wallMatExterior));
            stairRoom.add(createClosedDoor(pts, baseY, baseY + 7.0, { flipLock: true, solidColor: true }));
          }
        } else if (feat.type === 'W') {
          // Stair-room window on rooftop:
          if (roomHeight > 3.5) {
            // Complete view: 10 ft rooftop stair-room window increased by 1/5 upward (from 5 ft to 6 ft)
            const winH = (feat.h || 5.0) * 1.2;
            stairRoom.add(createOpaqueWindow(pts, baseY, baseY + winH));
            if (roomHeight > winH) {
              stairRoom.add(createPrismMesh(pts, baseY + winH, baseY + roomHeight, wallMatExterior));
            }
          } else {
            // Current view: 3 ft rooftop stair-room, top window excluded (kept at 3.0 ft)
            stairRoom.add(createOpaqueWindow(pts, baseY, baseY + roomHeight));
          }
        } else {
          // Solid side walls (Features 1 & 2) up to roomHeight
          stairRoom.add(createPrismMesh(pts, baseY, baseY + roomHeight, wallMatExterior));
        }
      }

      // Roof slab covering the stair room at baseY + roomHeight
      // Stair room bounds: X: 22.824 .. 33.927, Z: 16.968 .. 39.616
      const minX = 22.45, maxX = 34.30, minZ = 16.60, maxZ = 39.95;
      const roofH = 0.35;
      const stairRoof = new THREE.Mesh(
        new THREE.BoxGeometry(maxX - minX, roofH, maxZ - minZ),
        roofTileMat
      );
      stairRoof.position.set((minX + maxX) / 2, baseY + roomHeight + roofH / 2, (minZ + maxZ) / 2);
      stairRoom.add(stairRoof);

      return stairRoom;
    }

    // Cleaned perimeter parapet wall polygon for Complete view roof-top:
    // Removes the 4 corner inward balcony divider walls and corner returns (indices 26..27, 51..52, 60..61, 83..84, 94..95, 116..117)
    // as marked in the user's reference image
    const toRemoveIndices = new Set([26, 27, 51, 52, 60, 61, 83, 84, 94, 95, 116, 117]);
    const ROOF_PARAPET_PTS = THIRD_FEATURES[6].pts.filter((_, idx) => !toRemoveIndices.has(idx));

    // ROOF TERRACE COMPLETE VIEW BUILDER
    // - Stair-room portion from building_layout_third.geojson (present 10.0 ft height)
    // - Continuous 2.5 ft perimeter parapet wall with solid top cap (image marked walls removed)
    // - All 8 outer pillars restored at 2.5 ft height with solid top cap (Features 7 to 14)
    function buildCompleteRoofTerrace(roofElevation = 42.0) {
      const group = new THREE.Group();
      group.name = 'roofTerraceComplete';

      // 1. Paved roof terrace floor slab at 42.0 ft
      group.add(createSlabMesh(roofElevation, roofElevation + 0.35, roofTileMat));

      const slabTop = roofElevation + 0.35;
      const parapetHeight = 2.5;

      // 2. Continuous perimeter parapet wall (2.5 ft) with solid top cap (image marked walls removed)
      group.add(createPrismMesh(ROOF_PARAPET_PTS, slabTop, slabTop + parapetHeight, wallMatExterior));
      group.add(createPrismMesh(ROOF_PARAPET_PTS, slabTop + parapetHeight, slabTop + parapetHeight + 0.12, parapetCapMat));

      // 3. Outer edge pillars at 2.5 ft height with solid top cap:
      // Restored missing pillars of four corner-side area (7, 8, 13, 14) along with 9, 10, 11, 12
      for (const feat of THIRD_FEATURES) {
        if (!feat.pts || feat.pts.length < 3) continue;
        if (feat.id >= 7 && feat.id <= 14) {
          group.add(createPrismMesh(feat.pts, slabTop, slabTop + parapetHeight, wallMatExterior));
          group.add(createPrismMesh(feat.pts, slabTop + parapetHeight, slabTop + parapetHeight + 0.12, parapetCapMat));
        }
      }

      // 4. Stair-room portion from building_layout_third.geojson (kept at present 10.0 ft height)
      group.add(buildStairRoomPortion(roofElevation, 10.0));

      return group;
    }

    function buildThirdFloorCurrent() {

      // 2 plastic 1000L water tanks on rooftop terrace before stair-room door

      function createSingleWaterTank(x, yBase, z) {
        const tg = new THREE.Group();
        const R = 2.5;   // radius 2.5 ft (diameter 5.0 ft)
        const H = 6.0;   // total height 6.0 ft

        // 1. Base bottom rim
        const baseH = 0.20;
        const baseGeom = new THREE.CylinderGeometry(R * 0.98, R * 0.94, baseH, 36);
        const baseMesh = new THREE.Mesh(baseGeom, tankMat);
        baseMesh.position.y = baseH / 2;
        tg.add(baseMesh);

        // 2. Main vertical cylinder body (height 5.0 ft from y = 0.2 to 5.2)
        const bodyH = 5.0;
        const bodyGeom = new THREE.CylinderGeometry(R, R, bodyH, 36);
        const bodyMesh = new THREE.Mesh(bodyGeom, tankMat);
        bodyMesh.position.y = baseH + bodyH / 2; // y = 2.70
        tg.add(bodyMesh);

        // 3. Horizontal molded ribs (6 ribs evenly spaced along the cylinder body)
        const ribGeom = new THREE.TorusGeometry(R + 0.02, 0.04, 8, 36);
        ribGeom.rotateX(Math.PI / 2);
        const ribYPositions = [0.9, 1.7, 2.5, 3.3, 4.1, 4.9];
        for (const ry of ribYPositions) {
          const rib = new THREE.Mesh(ribGeom, tankMat);
          rib.position.y = ry;
          tg.add(rib);
        }

        // 4. Gentle shoulder dome (decreased slope: low-rise gentle taper from R to 0.72*R)
        const domeH = 0.35;
        const domeRTop = R * 0.72; // 1.80 ft
        const domeGeom = new THREE.CylinderGeometry(domeRTop, R, domeH, 36);
        const domeMesh = new THREE.Mesh(domeGeom, tankMat);
        domeMesh.position.y = 5.20 + domeH / 2;
        tg.add(domeMesh);

        // 5. Gentle inner shoulder cap (radius 1.80 down to 1.10 ft)
        const capH = 0.20;
        const capRTop = 1.10;
        const capGeom = new THREE.CylinderGeometry(capRTop, domeRTop, capH, 36);
        const capMesh = new THREE.Mesh(capGeom, tankMat);
        capMesh.position.y = 5.55 + capH / 2;
        tg.add(capMesh);

        // 6. Central inspection neck (radius 1.0)
        const neckH = 0.17;
        const neckGeom = new THREE.CylinderGeometry(1.0, 1.0, neckH, 32);
        const neckMesh = new THREE.Mesh(neckGeom, tankLidMat);
        neckMesh.position.y = 5.75 + neckH / 2;
        tg.add(neckMesh);

        // 7. Screw lid cap (radius 1.06)
        const lidH = 0.08;
        const lidGeom = new THREE.CylinderGeometry(1.06, 1.06, lidH, 32);
        const lidMesh = new THREE.Mesh(lidGeom, tankLidMat);
        lidMesh.position.y = 5.92 + lidH / 2;
        tg.add(lidMesh);

        // 8. Molded vertical reinforcement gussets on shoulder (4 gussets, low profile)
        const gussetGeom = new THREE.BoxGeometry(0.16, 0.26, 0.35);
        const gussetAngles = [0, Math.PI / 2, Math.PI, Math.PI * 1.5];
        for (const ga of gussetAngles) {
          const g = new THREE.Mesh(gussetGeom, tankMat);
          const gr = R * 0.85;
          g.position.set(Math.cos(ga) * gr, 5.36, Math.sin(ga) * gr);
          g.rotation.y = -ga;
          tg.add(g);
        }

        // Lifting eyelet rings removed as requested

        tg.position.set(x, yBase, z);
        return tg;
      }

      const yFloor = 32.35;
      const xMid = 28.338;
      const gap = 0.50; // 6 inch gap

      const distCenters = 2 * R + gap; // 5.5 ft

    // BUILD THIRD FLOOR COMPLETE VIEW (4th story from 1st floor geojson + roof terrace on top)

    // =========================================================================

    function buildExteriorPipes() {
      const group = new THREE.Group();
      group.name = 'exteriorPipesGroup';

      const whitePipeMat = new THREE.MeshStandardMaterial({
        color: '#f0f3f6',
        roughness: 0.32,

      });
      const greenPipeMat = new THREE.MeshStandardMaterial({
        color: '#1b7d34',
        roughness: 0.36,
        metalness: 0.08
      });
      const clampMat = new THREE.MeshStandardMaterial({
        color: '#343a40',
        roughness: 0.55,
        metalness: 0.35
      });

      function createPipeRun(points, radius, material, addClamps = true, wallFace = null) {
        const pipeSubGroup = new THREE.Group();
        const sphereGeom = new THREE.SphereGeometry(radius * 1.05, 16, 16);

        for (let i = 0; i < points.length - 1; i++) {
          const p1 = new THREE.Vector3(...points[i]);
          const p2 = new THREE.Vector3(...points[i + 1]);
          const v = new THREE.Vector3().subVectors(p2, p1);
          const len = v.length();
          if (len < 0.001) continue;

          const cylGeom = new THREE.CylinderGeometry(radius, radius, len, 18);
          const mesh = new THREE.Mesh(cylGeom, material);

          const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
          mesh.position.copy(mid);

          const up = new THREE.Vector3(0, 1, 0);
          const quat = new THREE.Quaternion().setFromUnitVectors(up, v.clone().normalize());
          mesh.quaternion.copy(quat);
          pipeSubGroup.add(mesh);

          if (i > 0) {
            const joint = new THREE.Mesh(sphereGeom, material);
            joint.position.copy(p1);
            pipeSubGroup.add(joint);
          }

          if (addClamps && wallFace && Math.abs(v.y) > 4.0) {
            const numClamps = Math.max(1, Math.floor(len / 8.0));
            for (let c = 1; c <= numClamps; c++) {
              const t = c / (numClamps + 1);
              const cp = new THREE.Vector3().lerpVectors(p1, p2, t);
              const clampGeom = (wallFace === 'X') ?
                new THREE.BoxGeometry(0.12, 0.08, radius * 2.8) :
                new THREE.BoxGeometry(radius * 2.8, 0.08, 0.12);
              const clampMesh = new THREE.Mesh(clampGeom, clampMat);
              clampMesh.position.copy(cp);
              pipeSubGroup.add(clampMesh);
            }
          }
        }
        return pipeSubGroup;
      }

      // Pipe Radii (in ft)

      const R1 = 0.0417;    // 1-inch diameter (drinking water branches)

      const southZMax = 35.0; // stops before driveway

      // 2. SOUTH FACADE PIPES (Image 1 - User Correction)

      // 1" Green pipe: drops vertically from 3rd floor at Z = 7.6, jogs OVER toilet window at Y = 19.5 across to Z = 10.4, drops along right jamb to Y = 8.0
      group.add(createPipeRun([

      group.add(createPipeRun([

      // 1" Green pipe: drops from 3rd floor at Z = 28.75, at Y = 11.2 jogs across clerestory window lintel to Z = 24.5 (left jamb), drops to Y = 2.0
      group.add(createPipeRun([

      const xN_vert4 = X_NORTH + R4 + 0.03;

      // Left assembly (near Front):

      group.add(createPipeRun([

      group.add(createPipeRun([

      // 4. BACK FACADE PIPES (Image 3)
      const zB_vert4 = Z_BACK - R4 - 0.03;

      group.add(createPipeRun([

      // 2nd floor horizontal drain branch: at Y = 21.0 (under window sill at 24.5), runs left to X = 13.5
      group.add(createPipeRun([

      group.add(createPipeRun([

      ], R4, whitePipeMat, false));

      // 1st floor horizontal drain branch to left: from X = 24.0 to X = 18.0 at Y = 9.0
      group.add(createPipeRun([

      // Green Drinking Water Network:

      group.add(createPipeRun([

      // 2" Horizontal Distribution Header at Y = 11.8 (in floor beam band between 2nd and 1st floor):

        [23.8, 0.5, zB_vertG2], // left vertical drop to ground

      // Vertical 1" branch drop at X = 35.8 from Y = 11.8 down to Y = 0.5
      group.add(createPipeRun([
        [35.8, 11.8, zB_vertG1],
        [35.8, 0.5, zB_vertG1]

      // Right vertical 1" green pipe at X = 47.5, from roof Y = 34.85 all the way to ground Y = 0.5
      group.add(createPipeRun([
        [47.5, Y_ROOF, zB_vertG1],

      // Left vertical 1" green pipe at X = 9.8 (in solid wall between veranda and bedroom window), from roof Y = 34.85 down to 2nd floor Y = 22.0
      group.add(createPipeRun([
        [9.8, Y_ROOF, zB_vertG1],
        [9.8, 22.0, zB_vertG1]
      ], R1, greenPipeMat, true, 'Z'));

      return group;
    }

    const exteriorPipesGroup = buildExteriorPipes();
    buildingGroup.add(exteriorPipesGroup);
    window.exteriorPipesGroup = exteriorPipesGroup;

    buildingContainer.add(buildingGroup);
    scene.add(buildingContainer);

    // Expose floor groups globally for inspection
    window.buildingContainer = buildingContainer;
    window.buildingGroup = buildingGroup;
    window.secondFloorGroup = secondFloorGroup;
    window.groundFloorGroup = groundFloorGroup;
    window.firstFloorGroup = firstFloorGroup;

    // =========================================================================
    // Grass & Sky Outdoor Landscaping (Road, Orange Jessamine Tree, Flowerbed)
    // =========================================================================
    function createGrassDecorGroup() {
      const decorGroup = new THREE.Group();
      decorGroup.name = 'grassDecorGroup';

      // 1. ROAD SYSTEM (CAD coordinates)
      // Left edge straight along garage left line at X = 1.043
      // Right edge along X = 15.0 curving smoothly into front road at Z = 54.0
      const roadGroup = new THREE.Group();
      roadGroup.name = 'roadGroup';

      const asphaltMat = new THREE.MeshStandardMaterial({
        color: '#343638',
        roughness: 0.88,
        metalness: 0.08,
        side: THREE.DoubleSide
      });
      const curbMat = new THREE.MeshStandardMaterial({
        color: '#c4beb4',
        roughness: 0.82
      });

      const roadShape = new THREE.Shape();
      roadShape.moveTo(1.043, -38.6);
      roadShape.lineTo(1.043, -170.0);
      roadShape.lineTo(15.0, -170.0);
      roadShape.lineTo(15.0, -60.0);
      roadShape.quadraticCurveTo(15.0, -54.0, 21.0, -54.0);
      roadShape.lineTo(64.0, -54.0);
      roadShape.lineTo(64.0, -38.6);
      roadShape.closePath();

      const roadGeom = new THREE.ShapeGeometry(roadShape);
      const roadMesh = new THREE.Mesh(roadGeom, asphaltMat);
      roadMesh.rotation.x = -Math.PI / 2;
      roadMesh.position.y = 0.05;
      roadGroup.add(roadMesh);

      function addCurb(x1, z1, x2, z2, width = 0.50, height = 0.30) {
        const dx = x2 - x1;
        const dz = z2 - z1;
        const len = Math.hypot(dx, dz);
        const ang = Math.atan2(dx, dz);
        const curbGeom = new THREE.BoxGeometry(width, height, len);
        const curbMesh = new THREE.Mesh(curbGeom, curbMat);
        curbMesh.position.set((x1 + x2) / 2, height / 2 + 0.05, (z1 + z2) / 2);
        curbMesh.rotation.y = ang;
        roadGroup.add(curbMesh);
      }

      // Left curb: straight along X = 1.043 from front wall Z = 38.6 down to Z = 170.0
      addCurb(1.043, 38.6, 1.043, 170.0);

      // Right vertical curb: along X = 15.0 from Z = 170.0 up to Z = 60.0
      addCurb(15.0, 170.0, 15.0, 60.0);

      // Smooth corner fillet from (15.0, 60.0) to (21.0, 54.0) matching quadratic bezier
      const N = 8;
      for (let i = 0; i < N; i++) {
        const t0 = i / N;
        const t1 = (i + 1) / N;
        const p0x = 15.0 + 6.0 * t0 * t0;
        const p0z = 54.0 + 6.0 * (1 - t0) * (1 - t0);
        const p1x = 15.0 + 6.0 * t1 * t1;
        const p1z = 54.0 + 6.0 * (1 - t1) * (1 - t1);
        addCurb(p0x, p0z, p1x, p1z, 0.50, 0.30);
      }

      // Right horizontal curb: along Z = 54.0 from X = 21.0 to X = 64.0
      addCurb(21.0, 54.0, 64.0, 54.0);
      // Far right edge curb: along X = 64.0 from Z = 54.0 to Z = 38.6
      addCurb(64.0, 54.0, 64.0, 38.6);

      decorGroup.add(roadGroup);

      // =========================================================================
      // 2. ORANGE JESSAMINE TREE (Murraya paniculata / Kamini)
      // Placed in circle position: X = -1.6, Z = 43.6 (slightly closer to driveway curb at X = 0.793)
      // Upright multi-stem shrub with lush rounded foliage, abundant 5-petal star flowers & buds
      // =========================================================================
      const treeGroup = new THREE.Group();
      treeGroup.name = 'orangeJessamineTree';
      treeGroup.position.set(-1.6, 0, 43.6);

      const barkMat = new THREE.MeshStandardMaterial({ color: '#4a3828', roughness: 0.90 });
      const leafDarkMat = new THREE.MeshStandardMaterial({ color: '#133e16', roughness: 0.72 });
      const leafMidMat = new THREE.MeshStandardMaterial({ color: '#1f5923', roughness: 0.68 });
      const leafBrightMat = new THREE.MeshStandardMaterial({ color: '#2f7533', roughness: 0.65 });
      const leafTipMat = new THREE.MeshStandardMaterial({ color: '#4d8e3d', roughness: 0.60 });
      const budMat = new THREE.MeshStandardMaterial({ color: '#bce26f', roughness: 0.50 });
      const flowerMat = new THREE.MeshStandardMaterial({
        color: '#ffffff',
        roughness: 0.20,
        emissive: '#ffffff',
        emissiveIntensity: 0.40,
        side: THREE.DoubleSide
      });
      const flowerCenterMat = new THREE.MeshStandardMaterial({
        color: '#f9a825',
        roughness: 0.35,
        emissive: '#f9a825',
        emissiveIntensity: 0.50,
        side: THREE.DoubleSide
      });

      // Tree border ring & soil
      const soilBase = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 2.2, 0.35, 20), new THREE.MeshStandardMaterial({ color: '#23180f', roughness: 0.98 }));
      soilBase.position.y = 0.18;
      treeGroup.add(soilBase);
      const stoneRing = new THREE.Mesh(new THREE.TorusGeometry(2.0, 0.18, 10, 26), curbMat);
      stoneRing.rotation.x = Math.PI / 2;
      stoneRing.position.y = 0.18;
      treeGroup.add(stoneRing);

      // Multi-stem woody trunk (visible between soil and lower foliage)
      const stemGeom = new THREE.CylinderGeometry(0.09, 0.16, 2.8, 7);
      const stems = [
        { x: 0.0, y: 1.35, z: 0.0, rx: 0.02, rz: -0.03 },
        { x: 0.22, y: 1.30, z: -0.10, rx: -0.09, rz: 0.13 },
        { x: -0.20, y: 1.30, z: 0.12, rx: 0.11, rz: -0.11 },
        { x: -0.12, y: 1.32, z: -0.16, rx: -0.11, rz: -0.08 },
        { x: 0.16, y: 1.25, z: 0.16, rx: 0.11, rz: 0.09 }
      ];
      for (const s of stems) {
        const m = new THREE.Mesh(stemGeom, barkMat);
        m.position.set(s.x, s.y, s.z);
        m.rotation.x = s.rx;
        m.rotation.z = s.rz;
        treeGroup.add(m);
      }

      // Organic bush canopy lobes (creating full rounded shrub form)
      const bushLobes = [
        // Core volumes
        { x: 0.0, y: 2.7, z: 0.0, rx: 1.8, ry: 1.5, rz: 1.8, mat: leafDarkMat },
        { x: 0.0, y: 4.1, z: 0.0, rx: 2.2, ry: 1.8, rz: 2.2, mat: leafMidMat },
        { x: 0.0, y: 5.5, z: 0.0, rx: 1.9, ry: 1.7, rz: 1.9, mat: leafBrightMat },
        { x: 0.0, y: 6.7, z: 0.0, rx: 1.3, ry: 1.3, rz: 1.3, mat: leafTipMat },

        // Lower tier outer tufts
        { x: 1.2, y: 2.6, z: 0.3, rx: 1.2, ry: 1.1, rz: 1.2, mat: leafMidMat },
        { x: -1.2, y: 2.6, z: -0.2, rx: 1.2, ry: 1.1, rz: 1.2, mat: leafMidMat },
        { x: 0.3, y: 2.5, z: 1.2, rx: 1.2, ry: 1.1, rz: 1.2, mat: leafBrightMat },
        { x: -0.3, y: 2.5, z: -1.2, rx: 1.2, ry: 1.1, rz: 1.2, mat: leafDarkMat },
        { x: 0.9, y: 3.4, z: 0.9, rx: 1.3, ry: 1.2, rz: 1.3, mat: leafBrightMat },
        { x: -0.9, y: 3.4, z: -0.9, rx: 1.3, ry: 1.2, rz: 1.3, mat: leafMidMat },
        { x: -0.9, y: 3.5, z: 0.9, rx: 1.3, ry: 1.2, rz: 1.3, mat: leafBrightMat },
        { x: 0.9, y: 3.5, z: -0.9, rx: 1.3, ry: 1.2, rz: 1.3, mat: leafMidMat },

        // Mid tier outer tufts (widest part of shrub)
        { x: 1.3, y: 4.5, z: 0.0, rx: 1.3, ry: 1.3, rz: 1.3, mat: leafBrightMat },
        { x: -1.3, y: 4.5, z: 0.0, rx: 1.3, ry: 1.3, rz: 1.3, mat: leafMidMat },
        { x: 0.0, y: 4.6, z: 1.3, rx: 1.3, ry: 1.3, rz: 1.3, mat: leafBrightMat },
        { x: 0.0, y: 4.6, z: -1.3, rx: 1.3, ry: 1.3, rz: 1.3, mat: leafDarkMat },
        { x: 0.8, y: 5.1, z: 0.8, rx: 1.2, ry: 1.2, rz: 1.2, mat: leafTipMat },
        { x: -0.8, y: 5.1, z: -0.8, rx: 1.2, ry: 1.2, rz: 1.2, mat: leafBrightMat },
        { x: -0.8, y: 5.2, z: 0.8, rx: 1.2, ry: 1.2, rz: 1.2, mat: leafTipMat },
        { x: 0.8, y: 5.2, z: -0.8, rx: 1.2, ry: 1.2, rz: 1.2, mat: leafBrightMat },

        // Upper tier outer tufts
        { x: 0.6, y: 6.3, z: 0.3, rx: 1.1, ry: 1.1, rz: 1.1, mat: leafTipMat },
        { x: -0.6, y: 6.3, z: -0.3, rx: 1.1, ry: 1.1, rz: 1.1, mat: leafTipMat },
        { x: 0.2, y: 6.4, z: -0.6, rx: 1.0, ry: 1.0, rz: 1.0, mat: leafBrightMat },
        { x: -0.2, y: 6.4, z: 0.6, rx: 1.0, ry: 1.0, rz: 1.0, mat: leafTipMat },
        { x: 0.0, y: 7.3, z: 0.0, rx: 0.85, ry: 0.85, rz: 0.85, mat: leafTipMat }
      ];

      const sphereGeom = new THREE.SphereGeometry(1, 10, 8);
      for (const l of bushLobes) {
        const m = new THREE.Mesh(sphereGeom, l.mat);
        m.position.set(l.x, l.y, l.z);
        m.scale.set(l.rx, l.ry, l.rz);
        treeGroup.add(m);
      }

      // Function to calculate maximum surface radius of all bush lobes along ray (dirX, dirY, dirZ) from center (0, yCenter, 0)
      function getCanopySurfacePoint(angle, yRel) {
        const y = 4.6 + yRel * 2.7;
        const cosA = Math.cos(angle);
        const sinA = Math.sin(angle);

        let maxR = 0;
        for (const l of bushLobes) {
          const dy = (y - l.y) / l.ry;
          if (Math.abs(dy) < 0.98) {
            const horizScale = Math.sqrt(1 - dy * dy);
            const lx = l.x;
            const lz = l.z;
            const proj = lx * cosA + lz * sinA;
            const lobeMaxR = proj + Math.max(l.rx, l.rz) * horizScale;
            if (lobeMaxR > maxR) maxR = lobeMaxR;
          }
        }
        if (maxR < 0.5) maxR = 1.6 * Math.sqrt(Math.max(0.1, 1 - yRel * yRel));
        return {
          x: cosA * maxR,
          y: y,
          z: sinA * maxR,
          r: maxR,
          nx: cosA,
          ny: yRel * 0.7,
          nz: sinA
        };
      }

      // Star flower shape geometry with 5 white petals
      function createJasmineFlowerGeometry(radius = 0.34) {
        const shape = new THREE.Shape();
        const petals = 5;
        for (let i = 0; i < petals * 2; i++) {
          const angle = (i * Math.PI) / petals;
          const r = (i % 2 === 0) ? radius : radius * 0.34;
          const x = Math.cos(angle) * r;
          const y = Math.sin(angle) * r;
          if (i === 0) shape.moveTo(x, y);
          else shape.lineTo(x, y);
        }
        shape.closePath();
        return new THREE.ShapeGeometry(shape);
      }
      const jasFlowerGeom = createJasmineFlowerGeometry(0.34);
      const centerGeom = new THREE.CircleGeometry(0.08, 6);
      const budGeom = new THREE.SphereGeometry(0.09, 6, 4);

      let seed = 811;
      function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }

      const flowerGroup = new THREE.Group();

      // Generate 75 clusters distributed all around the outer surface of the shrub (matching reference photo)
      const totalClusters = 75;
      for (let i = 0; i < totalClusters; i++) {
        const angle = i * 2.39996 + rnd() * 0.4;
        const yRel = -0.75 + (i / totalClusters) * 1.65 + (rnd() - 0.5) * 0.15;

        const surf = getCanopySurfacePoint(angle, Math.max(-0.95, Math.min(0.95, yRel)));

        const clusX = surf.x * 1.02;
        const clusY = surf.y;
        const clusZ = surf.z * 1.02;

        const normLen = Math.sqrt(surf.nx * surf.nx + surf.ny * surf.ny + surf.nz * surf.nz) || 1;
        const dirX = surf.nx / normLen;
        const dirY = surf.ny / normLen;
        const dirZ = surf.nz / normLen;

        const flowersInCluster = 3 + Math.floor(rnd() * 4);
        for (let f = 0; f < flowersInCluster; f++) {
          const ox = (rnd() - 0.5) * 0.42;
          const oy = (rnd() - 0.5) * 0.36;
          const oz = (rnd() - 0.5) * 0.42;

          const fx = clusX + ox;
          const fy = clusY + oy;
          const fz = clusZ + oz;

          const fl = new THREE.Mesh(jasFlowerGeom, flowerMat);
          fl.position.set(fx, fy, fz);
          fl.lookAt(fx + dirX + ox * 0.3, fy + dirY + oy * 0.3, fz + dirZ + oz * 0.3);
          fl.rotation.z += (rnd() - 0.5) * 1.2;
          flowerGroup.add(fl);

          const center = new THREE.Mesh(centerGeom, flowerCenterMat);
          center.position.set(fx, fy, fz);
          center.position.add(fl.getWorldDirection(new THREE.Vector3()).multiplyScalar(0.015));
          center.rotation.copy(fl.rotation);
          flowerGroup.add(center);

          if (f < 2) {
            const bud = new THREE.Mesh(budGeom, budMat);
            bud.position.set(fx + ox * 0.6, fy + 0.15 + oy * 0.4, fz + oz * 0.6);
            bud.scale.set(0.75, 1.4, 0.75);
            treeGroup.add(bud);
          }
        }
      }

      treeGroup.add(flowerGroup);
      decorGroup.add(treeGroup);

      // =========================================================================
      // 3. FLOWERBED FLUSH AGAINST WALL (Wall at Z = 37.841)
      // Between garage ramp (X = 12.5) and entrance steps (X = 23.8)
      // Back of planter directly touches wall at Z = 37.841 -> Center Z = 39.041 (depth 2.4 ft)
      // =========================================================================
      const planterGroup = new THREE.Group();
      planterGroup.name = 'electricBoxFlowerbed';
      planterGroup.position.set(18.15, 0, 39.041);

      const planterBorder = new THREE.Mesh(new THREE.BoxGeometry(11.3, 0.55, 2.4), curbMat);
      planterBorder.position.y = 0.275;
      planterGroup.add(planterBorder);

      const planterSoil = new THREE.Mesh(new THREE.BoxGeometry(10.7, 0.15, 1.9), new THREE.MeshStandardMaterial({ color: '#251b12', roughness: 0.98 }));
      planterSoil.position.y = 0.50;
      planterGroup.add(planterSoil);

      // Grassy Lily Leaf Blade Geometry (Rain Lily / Daylily / Zephyranthes)
      function createLilyBladeGeometry(height = 1.4, width = 0.08) {
        const shape = new THREE.Shape();
        shape.moveTo(-width / 2, 0);
        shape.lineTo(width / 2, 0);
        shape.lineTo(width * 0.4, height * 0.75);
        shape.lineTo(0, height);
        shape.lineTo(-width * 0.4, height * 0.75);
        shape.closePath();
        return new THREE.ShapeGeometry(shape);
      }

      const lilyBladeGeoms = [
        createLilyBladeGeometry(1.2, 0.08),
        createLilyBladeGeometry(1.5, 0.09),
        createLilyBladeGeometry(1.8, 0.10)
      ];

      const lilyLeafDarkMat = new THREE.MeshStandardMaterial({ color: '#1a4e20', roughness: 0.68, side: THREE.DoubleSide });
      const lilyLeafMidMat = new THREE.MeshStandardMaterial({ color: '#27682d', roughness: 0.65, side: THREE.DoubleSide });
      const lilyLeafBrightMat = new THREE.MeshStandardMaterial({ color: '#387e3e', roughness: 0.62, side: THREE.DoubleSide });
      const leafMats = [lilyLeafDarkMat, lilyLeafMidMat, lilyLeafBrightMat];

      // Grassy Lily tufts across the bed
      for (let px = -5.0; px <= 5.0; px += 0.52) {
        for (let pz = -0.70; pz <= 0.70; pz += 0.48) {
          const tuftX = px + (rnd() - 0.5) * 0.25;
          const tuftZ = pz + (rnd() - 0.5) * 0.20;
          const bladesCount = 9 + Math.floor(rnd() * 6);

          for (let b = 0; b < bladesCount; b++) {
            const geom = lilyBladeGeoms[Math.floor(rnd() * lilyBladeGeoms.length)];
            const mat = leafMats[Math.floor(rnd() * leafMats.length)];
            const blade = new THREE.Mesh(geom, mat);
            blade.position.set(tuftX, 0.50, tuftZ);

            const angle = (b * Math.PI * 2) / bladesCount + (rnd() - 0.5) * 0.35;
            const tilt = 0.18 + rnd() * 0.32;
            blade.rotation.y = angle;
            blade.rotation.x = Math.sin(angle) * tilt;
            blade.rotation.z = Math.cos(angle) * tilt;
            planterGroup.add(blade);
          }
        }
      }

      // 6-tepal Lily Flowers on slender stems
      function createLilyFlowerGeometry(radius = 0.25) {
        const shape = new THREE.Shape();
        const petals = 6;
        for (let i = 0; i < petals * 2; i++) {
          const angle = (i * Math.PI) / petals;
          const r = (i % 2 === 0) ? radius : radius * 0.35;
          const x = Math.cos(angle) * r;
          const y = Math.sin(angle) * r;
          if (i === 0) shape.moveTo(x, y);
          else shape.lineTo(x, y);
        }
        shape.closePath();
        return new THREE.ShapeGeometry(shape);
      }

      const lilyFlowerGeom = createLilyFlowerGeometry(0.25);
      const lilyCenterGeom = new THREE.CircleGeometry(0.065, 6);
      const stemCylGeom = new THREE.CylinderGeometry(0.02, 0.025, 1.3, 5);
      const stemMat = new THREE.MeshStandardMaterial({ color: '#27592b', roughness: 0.8 });

      const flowerColors = [
        '#ffffff', // Pure white
        '#ffeb3b', // Bright sunny yellow
        '#ff4081', // Rose pink
        '#e91e63', // Deep magenta
        '#ab47bc', // Lavender purple
        '#ff9800'  // Coral orange
      ];
      const flowerMats = flowerColors.map(c => new THREE.MeshStandardMaterial({
        color: c,
        roughness: 0.30,
        emissive: c,
        emissiveIntensity: 0.32,
        side: THREE.DoubleSide
      }));

      for (let px = -5.0; px <= 5.0; px += 0.44) {
        for (let pz = -0.70; pz <= 0.70; pz += 0.40) {
          if (rnd() > 0.82) continue;
          const fx = px + (rnd() - 0.5) * 0.22;
          const fz = pz + (rnd() - 0.5) * 0.20;
          const stemH = 1.0 + rnd() * 0.75;

          const stem = new THREE.Mesh(stemCylGeom, stemMat);
          stem.position.set(fx, 0.50 + stemH / 2, fz);
          stem.scale.set(1, stemH / 1.3, 1);
          stem.rotation.x = (rnd() - 0.5) * 0.18;
          stem.rotation.z = (rnd() - 0.5) * 0.18;
          planterGroup.add(stem);

          const fMat = flowerMats[Math.floor(rnd() * flowerMats.length)];
          const fl = new THREE.Mesh(lilyFlowerGeom, fMat);

    // Two-way synchronization between MapLibre and Three.js outdoor environments
    const BASE_ZOOM_CONST = 18.4341;

    function syncMapToThree() {
      if (!map) return;
      const p = Math.min(map.getPitch(), 85);
      const b = map.getBearing();
      const z = map.getZoom();
      const c = map.getCenter();

      const azDeg = (b + 180) % 360;
      const azRad = azDeg * Math.PI / 180;
      const pitchRad = Math.max(p, 0.001) * Math.PI / 180;

      const distGround = window.innerHeight / Math.pow(2, z - BASE_ZOOM_CONST);

      // In Three.js OrbitControls:
      // When p is near 0 (Top View), target is on ground (y = 0)
      // When p >= 30 (Perspective View), target is at building vertical center (y = 20)
      const t = Math.min(1, Math.max(0, p / 30));
      const targetY = t * 20;

      // Invert s = cy / dy where cy = targetY + dist * cos(pitchRad) and dy = dist * cos(pitchRad)
      // distGround = s * dist = (targetY + dist * cos(pitchRad)) / cos(pitchRad) = targetY / cos(pitchRad) + dist
      // Therefore: dist = distGround - targetY / Math.cos(pitchRad)
      const cosP = Math.max(Math.cos(pitchRad), 0.087);
      const dist = Math.min(1000, Math.max(10, distGround - targetY / cosP));

      const metersPerDegLat = 110770;
      const metersPerDegLng = 102370;
      const gx = (c.lng - plotLon) * metersPerDegLng / 0.3048;
      const gz = -(c.lat - plotLat) * metersPerDegLat / 0.3048;

      // Invert ground intersection to recover target center:
      const tx = gx + targetY * Math.tan(pitchRad) * Math.sin(azRad);
      const tz = gz - targetY * Math.tan(pitchRad) * Math.cos(azRad);

      controls.target.set(tx, targetY, tz);

      const cx = tx + dist * Math.sin(pitchRad) * Math.sin(azRad);
      const cy = targetY + dist * Math.cos(pitchRad);
      const cz = tz - dist * Math.sin(pitchRad) * Math.cos(azRad);

      camera.position.set(cx, cy, cz);
      controls.update();
    }

    function syncThreeToMap() {
      if (!map) return;
      const dx = camera.position.x - controls.target.x;
      const dy = camera.position.y - controls.target.y;
      const dz = camera.position.z - controls.target.z;
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
      const r_xz = Math.sqrt(dx * dx + dz * dz);

      const pitchRad = Math.atan2(r_xz, Math.max(dy, 0.001));
      const pitchDeg = Math.min(85, Math.max(0, pitchRad * 180 / Math.PI));

      let azDeg = Math.atan2(dx, -dz) * 180 / Math.PI;
      if (azDeg < 0) azDeg += 360;
      const bearing = (azDeg + 180) % 360;

      // Ground intersection: line of sight from camera through target to ground plane y = 0
      let gx = controls.target.x;
      let gz = controls.target.z;
      let distGround = dist;
      if (dy > 0.001) {
        const s = camera.position.y / dy;
        gx = camera.position.x - s * dx;
        gz = camera.position.z - s * dz;
        distGround = s * dist;
      }

      const metersPerDegLat = 110770;
      const metersPerDegLng = 102370;
      const lng = plotLon + (gx * 0.3048) / metersPerDegLng;
      const lat = plotLat - (gz * 0.3048) / metersPerDegLat;

      // Exact 1:1 scale matching between Three.js vertical FOV and MapLibre Mercator zoom:
      const zoom = Math.min(22, Math.max(10, BASE_ZOOM_CONST + Math.log2(window.innerHeight / Math.max(distGround, 1))));

      map.jumpTo({
        center: [lng, lat],
        zoom: zoom,
        pitch: pitchDeg,
        bearing: bearing
      });
      map.triggerRepaint();
    }

    window.syncThreeToMap = syncThreeToMap;
    window.syncMapToThree = syncMapToThree;
    window.plotLon = plotLon;
    window.plotLat = plotLat;

      currentViewMode = 'current';
      updateModeDisplay();
      if (typeof map !== 'undefined') map.triggerRepaint();
    };

    btnViewComplete.onclick = () => {
      if (currentEnv === 'studio') return;
      currentViewMode = 'complete';
      updateModeDisplay();
      if (typeof map !== 'undefined') map.triggerRepaint();
    };

    // Layer Controls
    btnLayer2d.onclick = () => {
      if (currentEnv !== 'studio') {
        btnEnvStudio.click();
      }
      studioPlanVisible = !studioPlanVisible;
      plan.visible = studioPlanVisible;
      btnLayer2d.classList.toggle('active', studioPlanVisible);
    };

    btnLayerFurniture.onclick = () => {
      if (currentEnv !== 'studio') {
        btnEnvStudio.click();
      }
      studioFurnitureVisible = !studioFurnitureVisible;
      furnitureGroup.visible = studioFurnitureVisible;
      btnLayerFurniture.classList.toggle('active', studioFurnitureVisible);
    };

    // Camera Controls
    btnCamReset.onclick = () => {
      if (currentEnv === 'default' || currentEnv === 'satellite') {
        map.flyTo({
          center: DEFAULT_MAP_CENTER,
          zoom: DEFAULT_MAP_ZOOM,
          pitch: DEFAULT_MAP_PITCH,
          bearing: DEFAULT_MAP_BEARING,
          duration: 800
        });
      } else if (currentEnv === 'studio') {
        camera.position.set(28.35, 43, 69);
        controls.target.set(28.35, 0, 20);
        controls.update();
      } else {
        camera.position.copy(DEFAULT_THREE_CAM);
        controls.target.copy(DEFAULT_THREE_TARGET);
        controls.update();
      }
    };

    btnCamTop.onclick = () => {
      if (currentEnv === 'default' || currentEnv === 'satellite') {
        const topZoom = 18.4341 + Math.log2(window.innerHeight / 180);
        map.flyTo({ center: [plotLon, plotLat], zoom: topZoom, pitch: 0, bearing: 0, duration: 800 });
      } else if (currentEnv === 'studio') {
        camera.position.set(28.35, 75, 20);
        controls.target.set(28.35, 0, 20);
        controls.update();
      } else {
        camera.position.set(0, 180, 0.01);
        controls.target.set(0, 0, 0);
        controls.update();
      }
    };

    // Initialize mode display
    updateModeDisplay();

    // Default Grass & Sky camera framing (supports ?cam=north|south|east|west|scd|tilt for inspection)
    const camParam = urlParams.get('cam');
    if (camParam === 'top') {
      if (currentEnv === 'studio') {
        camera.position.set(28.35, 75, 20);
        controls.target.set(28.35, 0, 20);
      } else {
        camera.position.set(0, 180, 0.01);
        controls.target.set(0, 0, 0);
      }
    } else if (camParam === 'north') {
      camera.position.set(28.35, 42, -68);
      controls.target.set(28.35, 21, 20);
    } else if (camParam === 'south') {
      camera.position.set(28.35, 30, 108);
      controls.target.set(28.35, 21, 20);
    } else if (camParam === 'east') {
      camera.position.set(112, 42, 20);
      controls.target.set(28.35, 21, 20);
    } else if (camParam === 'west') {
      camera.position.set(-58, 42, 20);
      controls.target.set(28.35, 21, 20);
    } else if (camParam === 'scd' || camParam === 'entrance') {
      camera.position.set(20.0, 6.5, 52);
      controls.target.set(20.0, 4.0, 32);
    } else if (camParam === 'entrancelintel') {
      camera.position.set(20.0, 11.0, 48);
      controls.target.set(26.0, 11.0, 37.841);
    } else if (camParam === 'columndetail') {
      camera.position.set(8.0, 27.0, 68);
      controls.target.set(28.0, 27.0, 39.0);
    } else if (camParam === 'garage') {
      camera.position.set(6.9, 5.0, 50);
      controls.target.set(6.9, 3.0, 35);
    } else if (camParam === 'stair') {
      camera.position.set(28.38, 5.0, 48);
      controls.target.set(28.38, 4.0, 26);
    } else if (camParam === 'userangle') {
      camera.position.set(8.0, 13.5, 54);
      controls.target.set(26.0, 15.0, 37);
    } else if (camParam === 'meterbox') {
      camera.position.set(19.35, 5.9, 48);
      controls.target.set(19.35, 5.9, 37.841);
    } else if (camParam === 'garagedoor') {
      camera.position.set(14.0, 5.0, 32);
      controls.target.set(24.0, 5.0, 32);
    } else if (camParam === 'tilt') {
      camera.position.set(65, 52, 95);
      controls.target.set(28.35, 21, 20);
    } else if (camParam === 'roof') {
      camera.position.set(28.35, 75, 55);
      controls.target.set(28.35, 42, 20);
    } else if (camParam === 'roofmatch') {
      camera.position.set(28.35, 68, 72);
      controls.target.set(28.35, 30, 20);
    } else if (camParam === 'entrancedoor') {
      camera.position.set(27.0, 6.0, 44);
      controls.target.set(27.0, 6.0, 17);
    } else if (camParam === 'backbalcony') {
      camera.position.set(54.0, 15.5, 4.0);
      controls.target.set(48.0, 15.5, 4.0);
    } else if (camParam === 'stairdoorsolid') {
      camera.position.set(26.0, 37.0, 32);
      controls.target.set(26.0, 35.0, 17);
    } else {
      if (currentEnv === 'studio') {
        camera.position.set(28.35, 43, 69);
        controls.target.set(28.35, 0, 20);
      } else {
        camera.position.copy(DEFAULT_THREE_CAM);
        controls.target.copy(DEFAULT_THREE_TARGET);
      }
    }
    controls.update();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>

</html>
